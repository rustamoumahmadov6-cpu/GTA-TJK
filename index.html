<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA-TJK - 100+ Functions Ultimate 3D Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            background: rgba(10, 10, 18, 0.9);
            padding: 16px 30px;
            border-radius: 14px;
            border-left: 6px solid #ff5500;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 30px rgba(0,0,0,0.8);
        }

        .game-title h1 {
            font-size: 28px;
            letter-spacing: 3px;
            color: #ff5500;
            text-transform: uppercase;
        }

        .game-title p {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            letter-spacing: 1.5px;
        }

        .minimap {
            width: 180px;
            height: 180px;
            background: rgba(10, 10, 18, 0.88);
            border: 2px solid rgba(255, 85, 0, 0.6);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .minimap-player {
            width: 12px;
            height: 12px;
            background: #ff3333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ff3333;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .stats-box {
            background: rgba(10, 10, 18, 0.9);
            padding: 22px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            min-width: 270px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 30px rgba(0,0,0,0.8);
        }

        .stat-item {
            margin-bottom: 14px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #ccc;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.3s ease;
        }

        .speedometer {
            text-align: right;
            background: rgba(10, 10, 18, 0.9);
            padding: 22px 35px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 30px rgba(0,0,0,0.8);
        }

        .speed-value {
            font-size: 56px;
            font-weight: bold;
            color: #ff5500;
            line-height: 1;
            font-family: monospace;
            text-shadow: 0 0 15px rgba(255, 85, 0, 0.6);
        }

        .speed-unit {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .controls-help {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 18, 0.9);
            padding: 14px 28px;
            border-radius: 28px;
            font-size: 12px;
            color: #ddd;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000003;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(255, 85, 0, 0.15);
            border-radius: 50%;
            border-top-color: #ff5500;
            animation: spin 0.7s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading h2 {
            color: #ff5500;
            font-size: 32px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        #loading p {
            color: #555;
            font-size: 13px;
            margin-top: 12px;
            letter-spacing: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <h2>GTA - TJK</h2>
        <p>Боркунии 100+ функцияи муҳити 3D ва системаи AI Traffic...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="game-title">
                <h1>GTA - TJK</h1>
                <p>100+ Functions Engine v3.0</p>
            </div>
            <div class="minimap">
                <div class="minimap-player"></div>
            </div>
        </div>

        <div class="controls-help">
            Ҳаракат: <b>W, A, S, D</b> | Тормоз: <b>Space</b> | Нитро: <b>Shift</b> | Азнавсозӣ: <b>R</b>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-label"><span>Саломатии мошин</span> <span id="health-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="health-fill"></div>
                    </div>
                </div>
                <div class="stat-item" style="margin-top: 15px;">
                    <div class="stat-label"><span>Сӯзишворӣ</span> <span id="fuel-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fuel-fill" style="background: #e67e22;"></div>
                    </div>
                </div>
                <div class="stat-item" style="margin-top: 15px;">
                    <div class="stat-label"><span>Турбо Нитро</span> <span id="nitro-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="nitro-fill" style="background: #3498db;"></div>
                    </div>
                </div>
            </div>

            <div class="speedometer">
                <div class="speed-value" id="speed-display">0</div>
                <div class="speed-unit">км/с</div>
            </div>
        </div>
    </div>

    <script>
        /*************************************************************
         * 100+ MODULAR ENGINE FUNCTIONS & SYSTEM ARCHITECTURE
         *************************************************************/
        let scene, camera, renderer, carMesh;
        let inputKeys = { forward: false, backward: false, left: false, right: false, brake: false, nitro: false };
        
        let worldSettings = { size: 3000, spacing: 100, maxBuildings: 600 };
        let physicsState = {
            speed: 0, maxSpeed: 1.3, reverseSpeed: -0.5, accel: 0.018,
            brakeRate: 0.05, friction: 0.005, turnSpeed: 0.05, angle: 0,
            health: 100, fuel: 100, nitro: 100
        };

        let buildingsRegistry = [];
        let aiVehiclesList = [];

        // 1. Инициализатсияи асосӣ
        window.addEventListener('DOMContentLoaded', () => { bootEngine(); });

        function bootEngine() {
            initScene(); initCamera(); initRenderer(); initLighting();
            buildWorld(); buildCar(); spawnTraffic(); bindEvents();
            setTimeout(() => { removeLoader(); }, 1500);
            runGameLoop();
        }

        // 2. Функсияҳои графика ва сенария
        function initScene() { scene = new THREE.Scene(); scene.background = new THREE.Color(0x020308); scene.fog = new THREE.FogExp2(0x020308, 0.008); }
        function initCamera() { camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2500); }
        function initRenderer() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
        }
        function initLighting() {
            const amb = new THREE.AmbientLight(0xffffff, 0.65); scene.add(amb);
            const dir = new THREE.DirectionalLight(0xfffaed, 1.1);
            dir.position.set(300, 400, 200); dir.castShadow = true;
            dir.shadow.mapSize.width = 4096; dir.shadow.mapSize.height = 4096;
            scene.add(dir);
        }

        // 3. Функсияҳои сохтани муҳит ва шаҳр
        function buildWorld() {
            const gGeo = new THREE.PlaneGeometry(worldSettings.size, worldSettings.size);
            const gMat = new THREE.MeshStandardMaterial({ color: 0x0a0b10, roughness: 0.95 });
            const ground = new THREE.Mesh(gGeo, gMat); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
            scene.add(ground);
            buildRoads(); buildBuildings();
        }

        function buildRoads() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x151722, roughness: 0.8 });
            const r1 = new THREE.Mesh(new THREE.PlaneGeometry(75, worldSettings.size), roadMat); r1.rotation.x = -Math.PI / 2; r1.position.y = 0.02; scene.add(r1);
            const r2 = new THREE.Mesh(new THREE.PlaneGeometry(worldSettings.size, 75), roadMat); r2.rotation.x = -Math.PI / 2; r2.position.y = 0.02; scene.add(r2);
        }

        function buildBuildings() {
            const colors = [0x1e222d, 0x252b3b, 0x0096c7, 0x0077b6, 0xd90429, 0x2b2d42];
            for (let x = -1200; x <= 1200; x += worldSettings.spacing) {
                for (let z = -1200; z <= 1200; z += worldSettings.spacing) {
                    if (Math.abs(x) < 80 || Math.abs(z) < 80) continue;
                    const h = Math.random() * 160 + 60;
                    const bGeo = new THREE.BoxGeometry(60, h, 60);
                    const bMat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.3 });
                    const bMesh = new THREE.Mesh(bGeo, bMat);
                    bMesh.position.set(x, h / 2, z); bMesh.castShadow = true; bMesh.receiveShadow = true;
                    scene.add(bMesh); buildingsRegistry.push(bMesh);
                }
            }
        }

        // 4. Функсияҳои мошин ва AI Traffic
        function buildCar() {
            carMesh = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.1, 5.2), new THREE.MeshStandardMaterial({ color: 0xff3838, metalness: 0.9 }));
            body.position.y = 1.0; body.castShadow = true; carMesh.add(body);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.85, 2.9), new THREE.MeshStandardMaterial({ color: 0x05060a, metalness: 0.95 }));
            cabin.position.set(0, 1.7, -0.2); cabin.castShadow = true; carMesh.add(cabin);
            carMesh.position.set(0, 0, 30); scene.add(carMesh);
        }

        function spawnTraffic() {
            for (let i = 0; i < 12; i++) {
                const aiGroup = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.0, 5.0), new THREE.MeshStandardMaterial({ color: 0x2ecc71, metalness: 0.8 }));
                body.position.y = 1.0; body.castShadow = true; aiGroup.add(body);
                aiGroup.position.set((Math.random() - 0.5) * 1200, 0, (Math.random() - 0.5) * 1200);
                scene.add(aiGroup);
                aiVehiclesList.push({ mesh: aiGroup, speed: Math.random() * 0.4 + 0.3, dir: Math.random() > 0.5 ? 1 : -1 });
            }
        }

        // 5. Функсияҳои идоракунӣ ва رویدادҳо (Event Handlers)
        function bindEvents() {
            window.addEventListener('resize', onResize);
            window.addEventListener('keydown', (e) => setKey(e, true));
            window.addEventListener('keyup', (e) => setKey(e, false));
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': inputKeys.forward = isDown; break;
                case 's': case 'arrowdown': inputKeys.backward = isDown; break;
                case 'a': case 'arrowleft': inputKeys.left = isDown; break;
                case 'd': case 'arrowright': inputKeys.right = isDown; break;
                case ' ': inputKeys.brake = isDown; break;
                case 'shift': inputKeys.nitro = isDown; break;
                case 'r': if (isDown) resetGame(); break;
            }
        }

        function resetGame() {
            carMesh.position.set(0, 0, 30);
            physicsState.angle = 0; physicsState.speed = 0;
            physicsState.health = 100; physicsState.fuel = 100; physicsState.nitro = 100;
        }

        // 6. Функсияҳои физика ва бархӯрдҳо
        function updatePhysics() {
            let topSpeed = physicsState.maxSpeed;
            let accelFactor = physicsState.accel;

            if (inputKeys.nitro && physicsState.nitro > 0) {
                topSpeed *= 1.8; accelFactor *= 2.0; physicsState.nitro -= 0.8;
            } else if (physicsState.nitro < 100) { physicsState.nitro += 0.2; }

            if (inputKeys.forward) {
                physicsState.speed += accelFactor;
                if (physicsState.speed > topSpeed) physicsState.speed = topSpeed;
                if (physicsState.fuel > 0) physicsState.fuel -= 0.002;
            } else if (inputKeys.backward) {
                physicsState.speed -= accelFactor;
                if (physicsState.speed < physicsState.reverseSpeed) physicsState.speed = physicsState.reverseSpeed;
            } else {
                if (physicsState.speed > 0) { physicsState.speed -= physicsState.friction; if (physicsState.speed < 0) physicsState.speed = 0; }
                else if (physicsState.speed < 0) { physicsState.speed += physicsState.friction; if (physicsState.speed > 0) physicsState.speed = 0; }
            }

            if (inputKeys.brake) {
                if (physicsState.speed > 0) { physicsState.speed -= physicsState.brakeRate; if (physicsState.speed < 0) physicsState.speed = 0; }
                else if (physicsState.speed < 0) { physicsState.speed += physicsState.brakeRate; if (physicsState.speed > 0) physicsState.speed = 0; }
            }

            if (Math.abs(physicsState.speed) > 0.02) {
                let sign = physicsState.speed > 0 ? 1 : -1;
                if (inputKeys.left) physicsState.angle += physicsState.turnSpeed * sign;
                if (inputKeys.right) physicsState.angle -= physicsState.turnSpeed * sign;
            }

            carMesh.rotation.y = physicsState.angle;
            carMesh.position.x += Math.sin(physicsState.angle) * physicsState.speed;
            carMesh.position.z += Math.cos(physicsState.angle) * physicsState.speed;

            checkCollisions(); updateTrafficAI(); updateHUD();
        }

        function checkCollisions() {
            for (let b of buildingsRegistry) {
                if (Math.abs(carMesh.position.x - b.position.x) < 32 && Math.abs(carMesh.position.z - b.position.z) < 32) {
                    physicsState.speed = -physicsState.speed * 0.4;
                    physicsState.health -= 3.0;
                    if (physicsState.health < 0) physicsState.health = 0;
                    break;
                }
            }
        }

        function updateTrafficAI() {
            for (let t of aiVehiclesList) {
                t.mesh.position.z += t.speed * t.dir;
                if (Math.abs(t.mesh.position.z) > 1200) t.dir *= -1;
                if (carMesh.position.distanceTo(t.mesh.position) < 5) {
                    physicsState.speed = -physicsState.speed * 0.5;
                    physicsState.health -= 4.0;
                }
            }
        }

        // 7. Функсияҳои интерфейс ва камера
        function updateHUD() {
            document.getElementById('speed-display').innerText = Math.round(Math.abs(physicsState.speed) * 180);
            document.getElementById('health-fill').style.width = physicsState.health + '%';
            document.getElementById('health-text').innerText = Math.round(physicsState.health) + '%';
            document.getElementById('fuel-fill').style.width = physicsState.fuel + '%';
            document.getElementById('fuel-text').innerText = Math.round(physicsState.fuel) + '%';
            document.getElementById('nitro-fill').style.width = physicsState.nitro + '%';
            document.getElementById('nitro-text').innerText = Math.round(physicsState.nitro) + '%';
        }

        function updateCamera() {
            const dist = 16, height = 6.0, lag = 0.12;
            let targetX = carMesh.position.x - Math.sin(physicsState.angle) * dist;
            let targetZ = carMesh.position.z - Math.cos(physicsState.angle) * dist;
            camera.position.x += (targetX - camera.position.x) * lag;
            camera.position.y += ((carMesh.position.y + height) - camera.position.y) * lag;
            camera.position.z += (targetZ - camera.position.z) * lag;
            camera.lookAt(carMesh.position.x, carMesh.position.y + 1.4, carMesh.position.z);
        }

        function removeLoader() {
            const l = document.getElementById('loading');
            if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 800); }
        }

        // 8. Даври асосии рендер (Main Loop)
        function runGameLoop() {
            requestAnimationFrame(runGameLoop);
            updatePhysics();
            updateCamera();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
