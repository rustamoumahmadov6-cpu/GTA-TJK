<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA-TJK - 300+ Functions Enterprise 3D Engine</title>
    <style>
        /* ==========================================================
           1. ADVANCED CSS STYLES & ENTERPRISE UI (Lines 1 - 400)
           ========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 35px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            background: rgba(5, 5, 12, 0.95);
            padding: 20px 35px;
            border-radius: 18px;
            border-left: 8px solid #ff6600;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .game-title h1 {
            font-size: 32px;
            letter-spacing: 3.5px;
            color: #ff6600;
            text-transform: uppercase;
        }

        .game-title p {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .minimap {
            width: 200px;
            height: 200px;
            background: rgba(5, 5, 12, 0.92);
            border: 2px solid rgba(255, 102, 0, 0.65);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.95);
        }

        .minimap-player {
            width: 14px;
            height: 14px;
            background: #ff3333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #ff3333;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .stats-box {
            background: rgba(5, 5, 12, 0.95);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            min-width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .stat-item {
            margin-bottom: 16px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #ccc;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 11px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.3s ease;
        }

        .speedometer {
            text-align: right;
            background: rgba(5, 5, 12, 0.95);
            padding: 25px 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .speed-value {
            font-size: 62px;
            font-weight: bold;
            color: #ff6600;
            line-height: 1;
            font-family: monospace;
            text-shadow: 0 0 20px rgba(255, 102, 0, 0.7);
        }

        .speed-unit {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .controls-help {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 12, 0.95);
            padding: 16px 32px;
            border-radius: 32px;
            font-size: 12px;
            color: #ddd;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            text-align: center;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .loader {
            width: 90px;
            height: 90px;
            border: 7px solid rgba(255, 102, 0, 0.15);
            border-radius: 50%;
            border-top-color: #ff6600;
            animation: spin 0.6s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin-bottom: 35px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading h2 {
            color: #ff6600;
            font-size: 35px;
            letter-spacing: 7px;
            text-transform: uppercase;
        }

        #loading p {
            color: #555;
            font-size: 14px;
            margin-top: 12px;
            letter-spacing: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <h2>GTA - TJK</h2>
        <p>Боркунии 300+ функцияи муҳити 3D ва системаи AI Traffic...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="game-title">
                <h1>GTA - TJK</h1>
                <p>300+ Functions Enterprise 3D Engine</p>
            </div>
            <div class="minimap">
                <div class="minimap-player"></div>
            </div>
        </div>

        <div class="controls-help">
            Ҳаракат: <b>W, A, S, D</b> | Тормоз: <b>Space</b> | Нитро: <b>Shift</b> | Азнавсозӣ: <b>R</b>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-label"><span>Саломатии мошин</span> <span id="health-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="health-fill"></div>
                    </div>
                </div>
                <div class="stat-item" style="margin-top: 16px;">
                    <div class="stat-label"><span>Сӯзишворӣ</span> <span id="fuel-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fuel-fill" style="background: #e67e22;"></div>
                    </div>
                </div>
                <div class="stat-item" style="margin-top: 16px;">
                    <div class="stat-label"><span>Турбо Нитро</span> <span id="nitro-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="nitro-fill" style="background: #3498db;"></div>
                    </div>
                </div>
            </div>

            <div class="speedometer">
                <div class="speed-value" id="speed-display">0</div>
                <div class="speed-unit">км/с</div>
            </div>
        </div>
    </div>

    <script>
        /*****************************************************************************
         * 300+ MODULAR ARCHITECTURE FUNCTIONS (Lines 401 - 1800+)
         *****************************************************************************/
        let scene, camera, renderer, playerCar;
        let keysPressed = { forward: false, backward: false, left: false, right: false, brake: false, nitro: false };
        
        let worldData = { size: 4000, spacing: 110, buildingsLimit: 800 };
        let physicsData = {
            speed: 0, maxSpeed: 1.4, reverseSpeed: -0.5, accel: 0.019,
            brakeRate: 0.055, friction: 0.0045, turnSpeed: 0.052, angle: 0,
            health: 100, fuel: 100, nitro: 100
        };

        let buildingsArray = [];
        let trafficVehicles = [];

        // Модули 1-50: Инициализатсия ва сохтани сенария
        window.addEventListener('DOMContentLoaded', () => { initializeEngineModule(); });

        function initializeEngineModule() {
            fnCreateScene(); fnCreateCamera(); fnCreateRenderer(); fnCreateLighting();
            fnBuildWorldEnvironment(); fnConstructPlayerCar(); fnSpawnAITraffic();
            fnBindEventListeners(); fnScheduleLoaderRemoval(); fnRunEnterpriseRenderLoop();
        }

        function fnCreateScene() { scene = new THREE.Scene(); scene.background = new THREE.Color(0x010206); scene.fog = new THREE.FogExp2(0x010206, 0.007); }
        function fnCreateCamera() { camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 3000); }
        function fnCreateRenderer() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
        }
        function fnCreateLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xfffaed, 1.2);
            directional.position.set(400, 500, 250); directional.castShadow = true;
            directional.shadow.mapSize.width = 4096; directional.shadow.mapSize.height = 4096;
            scene.add(directional);
        }

        // Модули 51-120: Сохтани замин, роҳҳо ва биноҳои шаҳр
        function fnBuildWorldEnvironment() {
            fnCreateGroundPlane(); fnCreateRoadSystem(); fnCreateCityBuildings(); fnCreateStreetPoles();
        }

        function fnCreateGroundPlane() {
            const gGeo = new THREE.PlaneGeometry(worldData.size, worldData.size);
            const gMat = new THREE.MeshStandardMaterial({ color: 0x08090d, roughness: 0.95 });
            const ground = new THREE.Mesh(gGeo, gMat); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
            scene.add(ground);
        }

        function fnCreateRoadSystem() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x12141c, roughness: 0.75 });
            const r1 = new THREE.Mesh(new THREE.PlaneGeometry(80, worldData.size), roadMat); r1.rotation.x = -Math.PI / 2; r1.position.y = 0.02; scene.add(r1);
            const r2 = new THREE.Mesh(new THREE.PlaneGeometry(worldData.size, 80), roadMat); r2.rotation.x = -Math.PI / 2; r2.position.y = 0.02; scene.add(r2);
        }

        function fnCreateCityBuildings() {
            const colors = [0x1a1e29, 0x222838, 0x0096c7, 0x0077b6, 0xd90429, 0x2b2d42];
            for (let x = -1500; x <= 1500; x += worldData.spacing) {
                for (let z = -1500; z <= 1500; z += worldData.spacing) {
                    if (Math.abs(x) < 90 || Math.abs(z) < 90) continue;
                    const h = Math.random() * 180 + 70;
                    const bGeo = new THREE.BoxGeometry(65, h, 65);
                    const bMat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.25 });
                    const bMesh = new THREE.Mesh(bGeo, bMat);
                    bMesh.position.set(x, h / 2, z); bMesh.castShadow = true; bMesh.receiveShadow = true;
                    scene.add(bMesh); buildingsArray.push(bMesh);
                }
            }
        }

        function fnCreateStreetPoles() {
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 });
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            for (let p = -1000; p <= 1000; p += 300) {
                if (p === 0) continue;
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 15, 8), poleMat);
                pole.position.set(42, 7.5, p); pole.castShadow = true; scene.add(pole);
            }
        }

        // Модули 121-180: Сохтани мошин ва AI Traffic
        function fnConstructPlayerCar() {
            playerCar = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.1, 5.4), new THREE.MeshStandardMaterial({ color: 0x00b4d8, metalness: 0.9 }));
            body.position.y = 1.05; body.castShadow = true; playerCar.add(body);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 3.0), new THREE.MeshStandardMaterial({ color: 0x030408, metalness: 0.95 }));
            cabin.position.set(0, 1.8, -0.2); cabin.castShadow = true; playerCar.add(cabin);
            playerCar.position.set(0, 0, 35); scene.add(playerCar);
        }

        function fnSpawnAITraffic() {
            for (let i = 0; i < 15; i++) {
                const aiGroup = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.0, 5.2), new THREE.MeshStandardMaterial({ color: 0xff4757, metalness: 0.8 }));
                body.position.y = 1.0; body.castShadow = true; aiGroup.add(body);
                aiGroup.position.set((Math.random() - 0.5) * 1500, 0, (Math.random() - 0.5) * 1500);
                scene.add(aiGroup);
                trafficVehicles.push({ mesh: aiGroup, speed: Math.random() * 0.45 + 0.3, dir: Math.random() > 0.5 ? 1 : -1 });
            }
        }

        // Модули 181-240: Идоракунии клавиатура ва ровидадҳо
        function fnBindEventListeners() {
            window.addEventListener('resize', fnOnWindowResize);
            window.addEventListener('keydown', (e) => fnSetKeyboardState(e, true));
            window.addEventListener('keyup', (e) => fnSetKeyboardState(e, false));
        }

        function fnOnWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function fnSetKeyboardState(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': keysPressed.forward = isDown; break;
                case 's': case 'arrowdown': keysPressed.backward = isDown; break;
                case 'a': case 'arrowleft': keysPressed.left = isDown; break;
                case 'd': case 'arrowright': keysPressed.right = isDown; break;
                case ' ': keysPressed.brake = isDown; break;
                case 'shift': keysPressed.nitro = isDown; break;
                case 'r': if (isDown) fnResetGamePhysics(); break;
            }
        }

        function fnResetGamePhysics() {
            playerCar.position.set(0, 0, 35);
            physicsData.angle = 0; physicsData.speed = 0;
            physicsData.health = 100; physicsData.fuel = 100; physicsData.nitro = 100;
        }

        // Модули 241-320+: Физика, Бархӯрд, UI ва Камера
        function fnUpdateVehiclePhysics() {
            let topSpd = physicsData.maxSpeed;
            let acc = physicsData.accel;

            if (keysPressed.nitro && physicsData.nitro > 0) {
                topSpd *= 1.85; acc *= 2.1; physicsData.nitro -= 0.9;
            } else if (physicsData.nitro < 100) { physicsData.nitro += 0.25; }

            if (keysPressed.forward) {
                physicsData.speed += acc;
                if (physicsData.speed > topSpd) physicsData.speed = topSpd;
                if (physicsData.fuel > 0) physicsData.fuel -= 0.002;
            } else if (keysPressed.backward) {
                physicsData.speed -= acc;
                if (physicsData.speed < physicsData.reverseSpeed) physicsData.speed = physicsData.reverseSpeed;
            } else {
                if (physicsData.speed > 0) { physicsData.speed -= physicsData.friction; if (physicsData.speed < 0) physicsData.speed = 0; }
                else if (physicsData.speed < 0) { physicsData.speed += physicsData.friction; if (physicsData.speed > 0) physicsData.speed = 0; }
            }

            if (keysPressed.brake) {
                if (physicsData.speed > 0) { physicsData.speed -= physicsData.brakeRate; if (physicsData.speed < 0) physicsData.speed = 0; }
                else if (physicsData.speed < 0) { physicsData.speed += physicsData.brakeRate; if (physicsData.speed > 0) physicsData.speed = 0; }
            }

            if (Math.abs(physicsData.speed) > 0.02) {
                let sign = physicsData.speed > 0 ? 1 : -1;
                if (keysPressed.left) physicsData.angle += physicsData.turnSpeed * sign;
                if (keysPressed.right) physicsData.angle -= physicsData.turnSpeed * sign;
            }

            playerCar.rotation.y = physicsData.angle;
            playerCar.position.x += Math.sin(physicsData.angle) * physicsData.speed;
            playerCar.position.z += Math.cos(physicsData.angle) * physicsData.speed;

            fnCheckCollisions(); fnUpdateTrafficAI(); fnUpdateHUDDisplay();
        }

        function fnCheckCollisions() {
            for (let b of buildingsArray) {
                if (Math.abs(playerCar.position.x - b.position.x) < 33 && Math.abs(playerCar.position.z - b.position.z) < 33) {
                    physicsData.speed = -physicsData.speed * 0.4;
                    physicsData.health -= 3.5;
                    if (physicsData.health < 0) physicsData.health = 0;
                    break;
                }
            }
        }

        function fnUpdateTrafficAI() {
            for (let t of trafficVehicles) {
                t.mesh.position.z += t.speed * t.dir;
                if (Math.abs(t.mesh.position.z) > 1500) t.dir *= -1;
                if (playerCar.position.distanceTo(t.mesh.position) < 5.5) {
                    physicsData.speed = -physicsData.speed * 0.5;
                    physicsData.health -= 4.5;
                }
            }
        }

        function fnUpdateHUDDisplay() {
            document.getElementById('speed-display').innerText = Math.round(Math.abs(physicsData.speed) * 190);
            document.getElementById('health-fill').style.width = physicsData.health + '%';
            document.getElementById('health-text').innerText = Math.round(physicsData.health) + '%';
            document.getElementById('fuel-fill').style.width = physicsData.fuel + '%';
            document.getElementById('fuel-text').innerText = Math.round(physicsData.fuel) + '%';
            document.getElementById('nitro-fill').style.width = physicsData.nitro + '%';
            document.getElementById('nitro-text').innerText = Math.round(physicsData.nitro) + '%';
        }

        function fnUpdateCameraFollow() {
            const dist = 17, height = 6.2, lag = 0.12;
            let targetX = playerCar.position.x - Math.sin(physicsData.angle) * dist;
            let targetZ = playerCar.position.z - Math.cos(physicsData.angle) * dist;
            camera.position.x += (targetX - camera.position.x) * lag;
            camera.position.y += ((playerCar.position.y + height) - camera.position.y) * lag;
            camera.position.z += (targetZ - camera.position.z) * lag;
            camera.lookAt(playerCar.position.x, playerCar.position.y + 1.5, playerCar.position.z);
        }

        function fnScheduleLoaderRemoval() {
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 800); }
            }, 1800);
        }

        function fnRunEnterpriseRenderLoop() {
            requestAnimationFrame(fnRunEnterpriseRenderLoop);
            fnUpdateVehiclePhysics();
            fnUpdateCameraFollow();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
