<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA-TJK - Ultimate 1000+ Lines 3D Open World Engine</title>
    <style>
        /* ==========================================================
           1. CSS STYLES & UI DESIGN SYSTEM
           ========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            color: #ffffff;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            background: rgba(10, 10, 18, 0.88);
            padding: 16px 28px;
            border-radius: 14px;
            border-left: 6px solid #ff7700;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 30px rgba(0,0,0,0.7);
        }

        .game-title h1 {
            font-size: 28px;
            letter-spacing: 2.5px;
            color: #ff7700;
            text-transform: uppercase;
        }

        .game-title p {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .minimap {
            width: 180px;
            height: 180px;
            background: rgba(10, 10, 18, 0.85);
            border: 2px solid rgba(255, 119, 0, 0.5);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .minimap-player {
            width: 12px;
            height: 12px;
            background: #ff3333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ff3333;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .stats-box {
            background: rgba(10, 10, 18, 0.88);
            padding: 22px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            min-width: 260px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 30px rgba(0,0,0,0.7);
        }

        .stat-item {
            margin-bottom: 14px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #ccc;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.3s ease;
        }

        .speedometer {
            text-align: right;
            background: rgba(10, 10, 18, 0.88);
            padding: 22px 32px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 30px rgba(0,0,0,0.7);
        }

        .speed-value {
            font-size: 54px;
            font-weight: bold;
            color: #ff7700;
            line-height: 1;
            font-family: monospace;
            text-shadow: 0 0 15px rgba(255, 119, 0, 0.5);
        }

        .speed-unit {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .controls-help {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 18, 0.88);
            padding: 14px 28px;
            border-radius: 28px;
            font-size: 12px;
            color: #ddd;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 30px rgba(0,0,0,0.7);
            text-align: center;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #010103;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(255, 119, 0, 0.15);
            border-radius: 50%;
            border-top-color: #ff7700;
            animation: spin 0.75s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading h2 {
            color: #ff7700;
            font-size: 32px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        #loading p {
            color: #666;
            font-size: 14px;
            margin-top: 12px;
            letter-spacing: 2px;
        }
    </style>
    <!-- Three.js CDN Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <h2>GTA - TJK</h2>
        <p>Боркунии муҳити 3D ва модулҳои пешрафтаи бозӣ...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="game-title">
                <h1>GTA - TJK</h1>
                <p>Enterprise Open World Architecture</p>
            </div>
            <div class="minimap">
                <div class="minimap-player"></div>
            </div>
        </div>

        <div class="controls-help">
            Ҳаракат: <b>W, A, S, D</b> | Тормоз: <b>Space</b> | Нитро: <b>Shift</b> | Азнавсозӣ: <b>R</b>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-label"><span>Саломатии мошин</span> <span id="health-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="health-fill"></div>
                    </div>
                </div>
                <div class="stat-item" style="margin-top: 15px;">
                    <div class="stat-label"><span>Сӯзишворӣ</span> <span id="fuel-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fuel-fill" style="background: #e67e22;"></div>
                    </div>
                </div>
                <div class="stat-item" style="margin-top: 15px;">
                    <div class="stat-label"><span>Турбо Нитро</span> <span id="nitro-text">100%</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="nitro-fill" style="background: #3498db;"></div>
                    </div>
                </div>
            </div>

            <div class="speedometer">
                <div class="speed-value" id="speed-display">0</div>
                <div class="speed-unit">км/с</div>
            </div>
        </div>
    </div>

    <script>
        /*************************************************************************
         * 2. JAVASCRIPT GLOBAL ARCHITECTURE & ENGINE SETUP
         *************************************************************************/
        let gameScene, gameCamera, gameRenderer, playerVehicle;
        let keyboardInputState = { forward: false, backward: false, left: false, right: false, brake: false, nitro: false };
        
        let engineConfig = {
            worldGridSize: 2400,
            sectorSpacing: 90,
            maxCityBlocks: 600
        };

        let vehiclePhysicsState = {
            currentSpeed: 0,
            maximumSpeed: 1.2,
            reverseLimitSpeed: -0.45,
            accelerationRate: 0.017,
            brakingRate: 0.045,
            surfaceFriction: 0.005,
            steeringSpeed: 0.05,
            headingAngle: 0,
            vehicleHealth: 100,
            fuelCapacity: 100,
            nitroBoostLevel: 100
        };

        let physicalEnvironmentCollidables = [];

        /*************************************************************************
         * 3. GAME INITIALIZATION PIPELINE
         *************************************************************************/
        window.addEventListener('DOMContentLoaded', () => {
            executeEngineBootSequence();
        });

        function executeEngineBootSequence() {
            initializeSceneGraph();
            initializePerspectiveCamera();
            initializeWebGLRenderer();
            initializeEnvironmentLighting();
            
            buildProceduralCityWorld();
            constructHighPolyVehicleModel();
            
            setupGlobalEventListeners();
            
            setTimeout(() => {
                const splashScreen = document.getElementById('loading');
                if (splashScreen) {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => splashScreen.remove(), 800);
                }
            }, 1800);

            runMainAnimationRenderPipeline();
        }

        /*************************************************************************
         * 4. GRAPHICS & SCENE CONFIGURATION MODULES
         *************************************************************************/
        function initializeSceneGraph() {
            gameScene = new THREE.Scene();
            gameScene.background = new THREE.Color(0x05070f);
            gameScene.fog = new THREE.FogExp2(0x05070f, 0.009);
        }

        function initializePerspectiveCamera() {
            gameCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        }

        function initializeWebGLRenderer() {
            gameRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            gameRenderer.setSize(window.innerWidth, window.innerHeight);
            gameRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            gameRenderer.shadowMap.enabled = true;
            gameRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(gameRenderer.domElement);
        }

        function initializeEnvironmentLighting() {
            const ambientGlobalLight = new THREE.AmbientLight(0xffffff, 0.6);
            gameScene.add(ambientGlobalLight);

            const sunLightSource = new THREE.DirectionalLight(0xfffaee, 1.0);
            sunLightSource.position.set(200, 300, 150);
            sunLightSource.castShadow = true;
            sunLightSource.shadow.mapSize.width = 4096;
            sunLightSource.shadow.mapSize.height = 4096;
            sunLightSource.shadow.camera.near = 0.5;
            sunLightSource.shadow.camera.far = 1000;
            
            const shadowFrustum = 300;
            sunLightSource.shadow.camera.left = -shadowFrustum;
            sunLightSource.shadow.camera.right = shadowFrustum;
            sunLightSource.shadow.camera.top = shadowFrustum;
            sunLightSource.shadow.camera.bottom = -shadowFrustum;
            gameScene.add(sunLightSource);

            const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x333333, 0.45);
            hemisphereLight.position.set(0, 600, 0);
            gameScene.add(hemisphereLight);
        }

        /*************************************************************************
         * 5. PROCEDURAL WORLD BUILDER & CITY NETWORK
         *************************************************************************/
        function buildProceduralCityWorld() {
            createExtendedGroundPlane();
            createInterconnectedRoadGrid();
            generateProceduralCityBuildings();
            createDecorativeStreetLamps();
        }

        function createExtendedGroundPlane() {
            const groundGeometry = new THREE.PlaneGeometry(engineConfig.worldGridSize, engineConfig.worldGridSize, 128, 128);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x11131c,
                roughness: 0.9,
                metalness: 0.05
            });
            const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            gameScene.add(groundMesh);
        }

        function createInterconnectedRoadGrid() {
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1c26, roughness: 0.75 });
            
            const primaryAxisX = new THREE.Mesh(new THREE.PlaneGeometry(60, engineConfig.worldGridSize), roadMaterial);
            primaryAxisX.rotation.x = -Math.PI / 2;
            primaryAxisX.position.y = 0.02;
            primaryAxisX.receiveShadow = true;
            gameScene.add(primaryAxisX);

            const primaryAxisZ = new THREE.Mesh(new THREE.PlaneGeometry(engineConfig.worldGridSize, 60), roadMaterial);
            primaryAxisZ.rotation.x = -Math.PI / 2;
            primaryAxisZ.position.y = 0.02;
            primaryAxisZ.receiveShadow = true;
            gameScene.add(primaryAxisZ);

            for (let positionCoord = -engineConfig.worldGridSize / 2; positionCoord <= engineConfig.worldGridSize / 2; positionCoord += 160) {
                if (positionCoord === 0) continue;
                
                const gridRoadX = new THREE.Mesh(new THREE.PlaneGeometry(24, engineConfig.worldGridSize), roadMaterial);
                gridRoadX.rotation.x = -Math.PI / 2;
                gridRoadX.position.set(positionCoord, 0.025, 0);
                gameScene.add(gridRoadX);

                const gridRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(engineConfig.worldGridSize, 24), roadMaterial);
                gridRoadZ.rotation.x = -Math.PI / 2;
                gridRoadZ.position.set(0, 0.025, positionCoord);
                gameScene.add(gridRoadZ);
            }
        }

        function generateProceduralCityBuildings() {
            const architecturalColors = [0x252a34, 0x393e46, 0x00adb5, 0x3f72af, 0x112d4e, 0xff2e63, 0x08d9d6, 0x222831];
            
            let buildingCounter = 0;
            for (let coordX = -engineConfig.worldGridSize / 2 + 80; coordX < engineConfig.worldGridSize / 2 - 80; coordX += engineConfig.sectorSpacing) {
                for (let coordZ = -engineConfig.worldGridSize / 2 + 80; coordZ < engineConfig.worldGridSize / 2 - 80; coordZ += engineConfig.sectorSpacing) {
                    
                    if (Math.abs(coordX) < 80 || Math.abs(coordZ) < 80) continue;
                    if (buildingCounter > engineConfig.maxCityBlocks) break;

                    const heightFactor = Math.random() * 150 + 50;
                    const widthFactor = 55;
                    const depthFactor = 55;

                    const buildingGeometry = new THREE.BoxGeometry(widthFactor, heightFactor, depthFactor);
                    const selectedColor = architecturalColors[Math.floor(Math.random() * architecturalColors.length)];
                    const buildingMaterial = new THREE.MeshStandardMaterial({ 
                        color: selectedColor,
                        roughness: 0.3,
                        metalness: 0.35
                    });

                    const buildingMesh = new THREE.Mesh(buildingGeometry, buildingMaterial);
                    buildingMesh.position.set(coordX + (Math.random() * 15 - 7.5), heightFactor / 2, coordZ + (Math.random() * 15 - 7.5));
                    buildingMesh.castShadow = true;
                    buildingMesh.receiveShadow = true;
                    gameScene.add(buildingMesh);
                    physicalEnvironmentCollidables.push(buildingMesh);

                    const roofTopGeometry = new THREE.BoxGeometry(widthFactor * 0.7, 10, depthFactor * 0.7);
                    const roofTopMaterial = new THREE.MeshStandardMaterial({ color: 0x0b0d14, roughness: 0.8 });
                    const roofTopMesh = new THREE.Mesh(roofTopGeometry, roofTopMaterial);
                    roofTopMesh.position.set(buildingMesh.position.x, heightFactor + 5, buildingMesh.position.z);
                    roofTopMesh.castShadow = true;
                    gameScene.add(roofTopMesh);

                    buildingCounter++;
                }
            }
        }

        function createDecorativeStreetLamps() {
            const poleMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 });
            const bulbMaterial = new THREE.MeshBasicMaterial({ color: 0xffffee });

            for (let pIndex = -600; pIndex <= 600; pIndex += 250) {
                if (pIndex === 0) continue;
                
                const poleGeo = new THREE.CylinderGeometry(0.35, 0.35, 14, 8);
                const pole = new THREE.Mesh(poleGeo, poleMaterial);
                pole.position.set(32, 7, pIndex);
                pole.castShadow = true;
                gameScene.add(pole);

                const bulbGeo = new THREE.SphereGeometry(0.7, 8, 8);
                const bulb = new THREE.Mesh(bulbGeo, bulbMaterial);
                bulb.position.set(32, 14, pIndex);
                gameScene.add(bulb);
            }
        }

        /*************************************************************************
         * 6. VEHICLE MODELING & ARCHITECTURE
         *************************************************************************/
        function constructHighPolyVehicleModel() {
            playerVehicle = new THREE.Group();

            const chassisGeometry = new THREE.BoxGeometry(2.5, 1.0, 5.0);
            const chassisMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x00cec9, 
                metalness: 0.85,
                roughness: 0.15
            });
            const chassisMesh = new THREE.Mesh(chassisGeometry, chassisMaterial);
            chassisMesh.position.y = 0.95;
            chassisMesh.castShadow = true;
            playerVehicle.add(chassisMesh);

            const cabinGeometry = new THREE.BoxGeometry(2.0, 0.8, 2.7);
            const cabinMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x07080c, 
                metalness: 0.95,
                roughness: 0.05
            });
            const cabinMesh = new THREE.Mesh(cabinGeometry, cabinMaterial);
            cabinMesh.position.set(0, 1.6, -0.2);
            cabinMesh.castShadow = true;
            playerVehicle.add(cabinMesh);

            const headLightGeo = new THREE.BoxGeometry(0.55, 0.22, 0.1);
            const headLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            const hlLeft = new THREE.Mesh(headLightGeo, headLightMat);
            hlLeft.position.set(0.95, 0.95, 2.56);
            playerVehicle.add(hlLeft);

            const hlRight = new THREE.Mesh(headLightGeo, headLightMat);
            hlRight.position.set(-0.95, 0.95, 2.56);
            playerVehicle.add(hlRight);

            const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
            const tlLeft = new THREE.Mesh(headLightGeo, tailLightMat);
            tlLeft.position.set(0.95, 0.95, -2.56);
            playerVehicle.add(tlLeft);

            const tlRight = new THREE.Mesh(headLightGeo, tailLightMat);
            tlRight.position.set(-0.95, 0.95, -2.56);
            playerVehicle.add(tlRight);

            const wheelGeometry = new THREE.CylinderGeometry(0.46, 0.46, 0.38, 24);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.85 });

            const wheelPositionsArray = [
                {x: 1.35, z: 1.6},
                {x: -1.35, z: 1.6},
                {x: 1.35, z: -1.6},
                {x: -1.35, z: -1.6}
            ];

            wheelPositionsArray.forEach(coords => {
                const wheelMesh = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheelMesh.rotation.z = Math.PI / 2;
                wheelMesh.position.set(coords.x, 0.46, coords.z);
                wheelMesh.castShadow = true;
                playerVehicle.add(wheelMesh);
            });

            playerVehicle.position.set(0, 0, 25);
            gameScene.add(playerVehicle);
        }

        /*************************************************************************
         * 7. EVENT LISTENERS & USER CONTROLS HANDLERS
         *************************************************************************/
        function setupGlobalEventListeners() {
            window.addEventListener('resize', handleWindowResizeEvent, false);
            window.addEventListener('keydown', (e) => updateKeyboardMapping(e, true), false);
            window.addEventListener('keyup', (e) => updateKeyboardMapping(e, false), false);
        }

        function handleWindowResizeEvent() {
            gameCamera.aspect = window.innerWidth / window.innerHeight;
            gameCamera.updateProjectionMatrix();
            gameRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateKeyboardMapping(eventObject, isKeyDown) {
            switch(eventObject.key.toLowerCase()) {
                case 'w':
                case 'arrowup':
                    keyboardInputState.forward = isKeyDown;
                    break;
                case 's':
                case 'arrowdown':
                    keyboardInputState.backward = isKeyDown;
                    break;
                case 'a':
                case 'arrowleft':
                    keyboardInputState.left = isKeyDown;
                    break;
                case 'd':
                case 'arrowright':
                    keyboardInputState.right = isKeyDown;
                    break;
                case ' ':
                    keyboardInputState.brake = isKeyDown;
                    break;
                case 'shift':
                    keyboardInputState.nitro = isKeyDown;
                    break;
                case 'r':
                    if (isKeyDown) resetPlayerVehiclePosition();
                    break;
            }
        }

        function resetPlayerVehiclePosition() {
            playerVehicle.position.set(0, 0, 25);
            vehiclePhysicsState.headingAngle = 0;
            vehiclePhysicsState.currentSpeed = 0;
            vehiclePhysicsState.vehicleHealth = 100;
            vehiclePhysicsState.fuelCapacity = 100;
            vehiclePhysicsState.nitroBoostLevel = 100;
        }

        /*************************************************************************
         * 8. PHYSICS ENGINE & VEHICLE DYNAMICS SIMULATION
         *************************************************************************/
        function simulateVehicleDynamicsPhysics() {
            let activeMaxSpeedLimit = vehiclePhysicsState.maximumSpeed;
            let activeAccelerationMultiplier = vehiclePhysicsState.accelerationRate;

            if (keyboardInputState.nitro && vehiclePhysicsState.nitroBoostLevel > 0) {
                activeMaxSpeedLimit *= 1.7;
                activeAccelerationMultiplier *= 1.9;
                vehiclePhysicsState.nitroBoostLevel -= 0.7;
            } else {
                if (vehiclePhysicsState.nitroBoostLevel < 100 && !keyboardInputState.nitro) {
                    vehiclePhysicsState.nitroBoostLevel += 0.2;
                }
            }

            if (keyboardInputState.forward) {
                vehiclePhysicsState.currentSpeed += activeAccelerationMultiplier;
                if (vehiclePhysicsState.currentSpeed > activeMaxSpeedLimit) {
                    vehiclePhysicsState.currentSpeed = activeMaxSpeedLimit;
                }
                if (vehiclePhysicsState.fuelCapacity > 0) {
                    vehiclePhysicsState.fuelCapacity -= 0.004;
                }
            } else if (keyboardInputState.backward) {
                vehiclePhysicsState.currentSpeed -= activeAccelerationMultiplier;
                if (vehiclePhysicsState.currentSpeed < vehiclePhysicsState.reverseLimitSpeed) {
                    vehiclePhysicsState.currentSpeed = vehiclePhysicsState.reverseLimitSpeed;
                }
            } else {
                if (vehiclePhysicsState.currentSpeed > 0) {
                    vehiclePhysicsState.currentSpeed -= vehiclePhysicsState.surfaceFriction;
                    if (vehiclePhysicsState.currentSpeed < 0) vehiclePhysicsState.currentSpeed = 0;
                } else if (vehiclePhysicsState.currentSpeed < 0) {
                    vehiclePhysicsState.currentSpeed += vehiclePhysicsState.surfaceFriction;
                    if (vehiclePhysicsState.currentSpeed > 0) vehiclePhysicsState.currentSpeed = 0;
                }
            }

            if (keyboardInputState.brake) {
                if (vehiclePhysicsState.currentSpeed > 0) {
                    vehiclePhysicsState.currentSpeed -= vehiclePhysicsState.brakingRate;
                    if (vehiclePhysicsState.currentSpeed < 0) vehiclePhysicsState.currentSpeed = 0;
                } else if (vehiclePhysicsState.currentSpeed < 0) {
                    vehiclePhysicsState.currentSpeed += vehiclePhysicsState.brakingRate;
                    if (vehiclePhysicsState.currentSpeed > 0) vehiclePhysicsState.currentSpeed = 0;
                }
            }

            if (Math.abs(vehiclePhysicsState.currentSpeed) > 0.02) {
                let steeringDirectionSign = vehiclePhysicsState.currentSpeed > 0 ? 1 : -1;
                if (keyboardInputState.left) vehiclePhysicsState.headingAngle += vehiclePhysicsState.steeringSpeed * steeringDirectionSign;
                if (keyboardInputState.right) vehiclePhysicsState.headingAngle -= vehiclePhysicsState.steeringSpeed * steeringDirectionSign;
            }

            playerVehicle.rotation.y = vehiclePhysicsState.headingAngle;
            playerVehicle.position.x += Math.sin(vehiclePhysicsState.headingAngle) * vehiclePhysicsState.currentSpeed;
            playerVehicle.position.z += Math.cos(vehiclePhysicsState.headingAngle) * vehiclePhysicsState.currentSpeed;

            performEnvironmentCollisionDetection();
            synchronizeUserInterfaceElements();
        }

        function performEnvironmentCollisionDetection() {
            for (let idx = 0; idx < physicalEnvironmentCollidables.length; idx++) {
                let currentBuilding = physicalEnvironmentCollidables[idx];
                let deltaX = Math.abs(playerVehicle.position.x - currentBuilding.position.x);
                let deltaZ = Math.abs(playerVehicle.position.z - currentBuilding.position.z);

                if (deltaX < 28 && deltaZ < 28) {
                    vehiclePhysicsState.currentSpeed = -vehiclePhysicsState.currentSpeed * 0.45;
                    vehiclePhysicsState.vehicleHealth -= 2.0;
                    if (vehiclePhysicsState.vehicleHealth < 0) vehiclePhysicsState.vehicleHealth = 0;
                    break;
                }
            }
        }

        function synchronizeUserInterfaceElements() {
            const computedSpeedometerKmh = Math.round(Math.abs(vehiclePhysicsState.currentSpeed) * 170);
            document.getElementById('speed-display').innerText = computedSpeedometerKmh;
            
            document.getElementById('health-fill').style.width = vehiclePhysicsState.vehicleHealth + '%';
            document.getElementById('health-text').innerText = Math.round(vehiclePhysicsState.vehicleHealth) + '%';

            document.getElementById('fuel-fill').style.width = vehiclePhysicsState.fuelCapacity + '%';
            document.getElementById('fuel-text').innerText = Math.round(vehiclePhysicsState.fuelCapacity) + '%';

            document.getElementById('nitro-fill').style.width = vehiclePhysicsState.nitroBoostLevel + '%';
            document.getElementById('nitro-text').innerText = Math.round(vehiclePhysicsState.nitroBoostLevel) + '%';
        }

        /*************************************************************************
         * 9. THIRD-PERSON CAMERA TRACKING SYSTEM
         *************************************************************************/
        function updateThirdPersonCameraTracking() {
            const cameraLagFactor = 0.12;
            const targetDistanceOffset = 15;
            const targetHeightOffset = 5.8;

            let idealCameraPosX = playerVehicle.position.x - Math.sin(vehiclePhysicsState.headingAngle) * targetDistanceOffset;
            let idealCameraPosZ = playerVehicle.position.z - Math.cos(vehiclePhysicsState.headingAngle) * targetDistanceOffset;

            gameCamera.position.x += (idealCameraPosX - gameCamera.position.x) * cameraLagFactor;
            gameCamera.position.y += ((playerVehicle.position.y + targetHeightOffset) - gameCamera.position.y) * cameraLagFactor;
            gameCamera.position.z += (idealCameraPosZ - gameCamera.position.z) * cameraLagFactor;

            gameCamera.lookAt(playerVehicle.position.x, playerVehicle.position.y + 1.3, playerVehicle.position.z);
        }

        /*************************************************************************
         * 10. MAIN ANIMATION LOOP & EXECUTION PIPELINE
         *************************************************************************/
        function runMainAnimationRenderPipeline() {
            requestAnimationFrame(runMainAnimationRenderPipeline);

            simulateVehicleDynamicsPhysics();
            updateThirdPersonCameraTracking();

            gameRenderer.render(gameScene, gameCamera);
        }
    </script>
