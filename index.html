<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA-TJK - 3D Open World Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0f;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay Styles */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            background: rgba(10, 10, 15, 0.85);
            padding: 12px 22px;
            border-radius: 10px;
            border-left: 4px solid #ff9900;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .game-title h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: #ff9900;
            text-transform: uppercase;
        }

        .game-title p {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .minimap {
            width: 160px;
            height: 160px;
            background: rgba(10, 10, 15, 0.8);
            border: 2px solid rgba(255, 153, 0, 0.3);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .minimap-player {
            width: 10px;
            height: 10px;
            background: #ff3333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff3333;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .stats-box {
            background: rgba(10, 10, 15, 0.85);
            padding: 18px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            min-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .stat-item {
            margin-bottom: 10px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.3s ease;
        }

        .speedometer {
            text-align: right;
            background: rgba(10, 10, 15, 0.85);
            padding: 18px 28px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .speed-value {
            font-size: 46px;
            font-weight: bold;
            color: #ff9900;
            line-height: 1;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        .speed-unit {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .controls-help {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.85);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: #bbb;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #07070a;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 153, 0, 0.15);
            border-radius: 50%;
            border-top-color: #ff9900;
            animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin-bottom: 25px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading h2 {
            color: #ff9900;
            font-size: 26px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #loading p {
            color: #555;
            font-size: 13px;
            margin-top: 8px;
            letter-spacing: 1px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <h2>GTA - TJK</h2>
        <p>Боркунии муҳити 3D ва системаи физика...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="game-title">
                <h1>GTA - TJK</h1>
                <p>Open World Engine v1.2</p>
            </div>
            <div class="minimap">
                <div class="minimap-player"></div>
            </div>
        </div>

        <div class="controls-help">
            Идоракунӣ: <b>W, A, S, D</b> ё <b>Стрелкаҳо</b> | Тормоз: <b>Space</b>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-label">Саломатии мошин</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="health-fill"></div>
                    </div>
                </div>
                <div class="stat-item" style="margin-top: 12px;">
                    <div class="stat-label">Нишони сӯзишворӣ</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fuel-fill" style="background: #e67e22;"></div>
                    </div>
                </div>
            </div>

            <div class="speedometer">
                <div class="speed-value" id="speed-display">0</div>
                <div class="speed-unit">км/с</div>
            </div>
        </div>
    </div>

    <script>
        // Тағйирёбандаҳои асосии системаи 3D ва физика
        let scene, camera, renderer, car;
        let keys = { forward: false, backward: false, left: false, right: false, brake: false };
        
        let carState = {
            speed: 0,
            maxSpeed: 0.9,
            reverseMaxSpeed: -0.35,
            acceleration: 0.016,
            braking: 0.035,
            friction: 0.007,
            turnSpeed: 0.045,
            angle: 0,
            health: 100,
            fuel: 100
        };

        window.addEventListener('DOMContentLoaded', () => {
            initGameEngine();
        });

        function initGameEngine() {
            // 1. Scene initialization
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f1016);
            scene.fog = new THREE.FogExp2(0x0f1016, 0.012);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 0.9);
            dirLight.position.set(100, 150, 80);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 500;
            const d = 150;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // 5. Build City Environment
            buildExtendedWorld();

            // 6. Build Detailed Car Model
            buildDetailedCar();

            // 7. Event Listeners for Input & Window resizing
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('keydown', (e) => handleInputState(e, true), false);
            window.addEventListener('keyup', (e) => handleInputState(e, false), false);

            // Remove loading overlay smoothly
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 600);
                }
            }, 1200);

            // Run Main Game Loop
            runGameLoop();
        }

        function buildExtendedWorld() {
            // Ground Plane
            const groundGeo = new THREE.PlaneGeometry(1500, 1500);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x1b1c24,
                roughness: 0.9
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Roads System Grid
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x262833, roughness: 0.8 });
            
            // Main Roads Crossing
            const roadMainX = new THREE.Mesh(new THREE.PlaneGeometry(40, 1500), roadMat);
            roadMainX.rotation.x = -Math.PI / 2;
            roadMainX.position.y = 0.02;
            scene.add(roadMainX);

            const roadMainZ = new THREE.Mesh(new THREE.PlaneGeometry(1500, 40), roadMat);
            roadMainZ.rotation.x = -Math.PI / 2;
            roadMainZ.position.y = 0.02;
            scene.add(roadMainZ);

            // Secondary Roads
            for(let i = -500; i <= 500; i += 120) {
                if(i === 0) continue;
                const r1 = new THREE.Mesh(new THREE.PlaneGeometry(16, 1500), roadMat);
                r1.rotation.x = -Math.PI / 2;
                r1.position.set(i, 0.025, 0);
                scene.add(r1);

                const r2 = new THREE.Mesh(new THREE.PlaneGeometry(1500, 16), roadMat);
                r2.rotation.x = -Math.PI / 2;
                r2.position.set(0, 0.025, i);
                scene.add(r2);
            }

            // City Buildings Generation
            const buildingColors = [0x3a405a, 0x474e68, 0x2f3640, 0x57606f, 0x3d3d4d];
            
            for (let x = -600; x <= 600; x += 70) {
                for (let z = -600; z <= 600; z += 70) {
                    // Keep roads clear
                    if (Math.abs(x) < 50 || Math.abs(z) < 50) continue;

                    const height = Math.random() * 110 + 30;
                    const width = 45;
                    const depth = 45;

                    const bGeo = new THREE.BoxGeometry(width, height, depth);
                    const randomColor = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                    const bMat = new THREE.MeshStandardMaterial({ 
                        color: randomColor,
                        roughness: 0.4,
                        metalness: 0.2
                    });

                    const building = new THREE.Mesh(bGeo, bMat);
                    building.position.set(x + (Math.random() * 10 - 5), height / 2, z + (Math.random() * 10 - 5));
                    building.castShadow = true;
                    building.receiveShadow = true;
                    scene.add(building);

                    // Add simple rooftop detail element for variation
                    const topGeo = new THREE.BoxGeometry(width * 0.6, 6, depth * 0.6);
                    const topMat = new THREE.MeshStandardMaterial({ color: 0x1f242d });
                    const rooftop = new THREE.Mesh(topGeo, topMat);
                    rooftop.position.set(building.position.x, height + 3, building.position.z);
                    rooftop.castShadow = true;
                    scene.add(rooftop);
                }
            }
        }

        function buildDetailedCar() {
            car = new THREE.Group();

            // Main Car Chassis
            const bodyGeo = new THREE.BoxGeometry(2.3, 0.9, 4.6);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0xe74c3c,
                metalness: 0.7,
                roughness: 0.3
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.85;
            body.castShadow = true;
            car.add(body);

            // Car Cabin Top
            const cabinGeo = new THREE.BoxGeometry(1.85, 0.75, 2.4);
            const cabinMat = new THREE.MeshStandardMaterial({ 
                color: 0x111217,
                metalness: 0.9,
                roughness: 0.1
            });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.45, -0.2);
            cabin.castShadow = true;
            car.add(cabin);

            // Headlights
            const lightGeo = new THREE.BoxGeometry(0.45, 0.18, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xfffae6 });
            
            const hlLeft = new THREE.Mesh(lightGeo, lightMat);
            hlLeft.position.set(0.85, 0.85, 2.31);
            car.add(hlLeft);

            const hlRight = new THREE.Mesh(lightGeo, lightMat);
            hlRight.position.set(-0.85, 0.85, 2.31);
            car.add(hlRight);

            // Wheels setup
            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 20);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });

            const wheelCoords = [
                {x: 1.25, z: 1.45},
                {x: -1.25, z: 1.45},
                {x: 1.25, z: -1.45},
                {x: -1.25, z: -1.45}
            ];

            wheelCoords.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos.x, 0.42, pos.z);
                wheel.castShadow = true;
                car.add(wheel);
            });

            car.position.set(0, 0, 15);
            scene.add(car);
        }

        function handleInputState(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w':
                case 'arrowup':
                    keys.forward = isDown;
                    break;
                case 's':
                case 'arrowdown':
                    keys.backward = isDown;
                    break;
                case 'a':
                case 'arrowleft':
                    keys.left = isDown;
                    break;
                case 'd':
                case 'arrowright':
                    keys.right = isDown;
                    break;
                case ' ':
                    keys.brake = isDown;
                    break;
            }
        }

        function simulateVehiclePhysics() {
            // Speed controls
            if (keys.forward) {
                carState.speed += carState.acceleration;
                if (carState.speed > carState.maxSpeed) carState.speed = carState.maxSpeed;
            } else if (keys.backward) {
                carState.speed -= carState.acceleration;
                if (carState.speed < carState.reverseMaxSpeed) carState.speed = carState.reverseMaxSpeed;
            } else {
                // Friction decay
                if (carState.speed > 0) {
                    carState.speed -= carState.friction;
                    if (carState.speed < 0) carState.speed = 0;
                } else if (carState.speed < 0) {
                    carState.speed += carState.friction;
                    if (carState.speed > 0) carState.speed = 0;
                }
            }

            // Braking
            if (keys.brake) {
                if (carState.speed > 0) {
                    carState.speed -= carState.braking;
                    if (carState.speed < 0) carState.speed = 0;
                } else if (carState.speed < 0) {
                    carState.speed += carState.braking;
                    if (carState.speed > 0) carState.speed = 0;
                }
            }

            // Turning mechanism
            if (Math.abs(carState.speed) > 0.02) {
                const turnFactor = carState.speed > 0 ? 1 : -1;
                if (keys.left) carState.angle += carState.turnSpeed * turnFactor;
                if (keys.right) carState.angle -= carState.turnSpeed * turnFactor;
            }

            // Update position in 3D world space
            car.rotation.y = carState.angle;
            car.position.x += Math.sin(carState.angle) * carState.speed;
            car.position.z += Math.cos(carState.angle) * carState.speed;

            // Update UI meters
            const currentSpeedKmh = Math.round(Math.abs(carState.speed) * 150);
            document.getElementById('speed-display').innerText = currentSpeedKmh;
            document.getElementById('health-fill').style.width = carState.health + '%';
            document.getElementById('fuel-fill').style.width = carState.fuel + '%';
        }

        function updateThirdPersonCamera() {
            const idealOffsetDistance = 13;
            const idealHeight = 5.2;

            const targetCamX = car.position.x - Math.sin(carState.angle) * idealOffsetDistance;
            const targetCamZ = car.position.z - Math.cos(carState.angle) * idealOffsetDistance;

            camera.position.x += (targetCamX - camera.position.x) * 0.12;
            camera.position.y += ((car.position.y + idealHeight) - camera.position.y) * 0.12;
            camera.position.z += (targetCamZ - camera.position.z) * 0.12;

            camera.lookAt(car.position.x, car.position.y + 1.2, car.position.z);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function runGameLoop() {
            requestAnimationFrame(runGameLoop);

            simulateVehiclePhysics();
            updateThirdPersonCamera();

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
