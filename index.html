<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Душанбе 3D - Нусхаи Навшуда</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #7ec0ee; font-family: Arial, sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(0, 0, 0, 0.8); padding: 15px;
            border-radius: 10px; border: 2px solid #ffcc00; z-index: 10;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ffcc00; }
        p { margin: 3px 0; font-size: 13px; }
        #minimap-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 150px; height: 150px; background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffcc00; border-radius: 50%; overflow: hidden; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>GTA: Душанбе 3D (Нусхаи Нав)</h1>
        <p>Идоракунӣ: <b>W, A, S, D</b> ё тирчаҳо</p>
    </div>
    <div id="minimap-container"></div>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x181818 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

        for (let i = -400; i <= 400; i += 100) {
            let roadX = new THREE.Mesh(new THREE.PlaneGeometry(20, 1000), roadMat);
            roadX.rotation.x = -Math.PI / 2; roadX.position.set(i, 0.01, 0); scene.add(roadX);

            let lineX = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 1000), lineMat);
            lineX.rotation.x = -Math.PI / 2; lineX.position.set(i, 0.02, 0); scene.add(lineX);

            let roadZ = new THREE.Mesh(new THREE.PlaneGeometry(1000, 20), roadMat);
            roadZ.rotation.x = -Math.PI / 2; roadZ.position.set(0, 0.015, i); scene.add(roadZ);
        }

        const bColors = [0xcccccc, 0xb0c4de, 0xdcdcdc, 0xdeb887, 0xbc8f8f];
        for (let x = -450; x <= 450; x += 50) {
            for (let z = -450; z <= 450; z += 50) {
                if (Math.abs(x % 100) < 30 || Math.abs(z % 100) < 30) continue;
                let h = 20 + Math.random() * 40;
                let b = new THREE.Mesh(new THREE.BoxGeometry(35, h, 35), new THREE.MeshStandardMaterial({ color: bColors[Math.floor(Math.random() * bColors.length)] }));
                b.position.set(x + 25, h / 2, z + 25); scene.add(b);
            }
        }

        const carGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 4.0), bodyMat);
        lowerBody.position.y = 0.5; carGroup.add(lowerBody);

        const wheelPositions = [[-1.0, 0.35, 1.3], [1.0, 0.35, 1.3], [-1.0, 0.35, -1.3], [1.0, 0.35, -1.3]];
        const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        wheelPositions.forEach(pos => {
            let w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.z = Math.PI / 2; w.position.set(...pos); carGroup.add(w);
        });

        carGroup.position.set(0, 0, 100); scene.add(carGroup);

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let speed = 0, angle = 0;
        const maxSpeed = 0.8;

        function animate() {
            requestAnimationFrame(animate);
            if (keys['w'] || keys['arrowup']) speed = Math.min(speed + 0.02, maxSpeed);
            else if (keys['s'] || keys['arrowdown']) speed = Math.max(speed - 0.02, -maxSpeed / 2);
            else speed *= 0.95;

            if (keys['a'] || keys['arrowleft']) angle += 0.03 * (speed / maxSpeed || 0.2);
            if (keys['d'] || keys['arrowright']) angle -= 0.03 * (speed / maxSpeed || 0.2);

            carGroup.rotation.y = angle;
            carGroup.position.x -= Math.sin(angle) * speed;
            carGroup.position.z -= Math.cos(angle) * speed;

            camera.position.set(carGroup.position.x + Math.sin(angle) * 12, carGroup.position.y + 5, carGroup.position.z + Math.cos(angle) * 12);
            camera.lookAt(carGroup.position);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
