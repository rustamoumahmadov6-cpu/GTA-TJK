<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Душанбе 3D - Лоиҳаи Пурра</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
            padding: 18px 22px;
            border-radius: 12px;
            border: 2px solid #ffcc00;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 8px 0; font-size: 20px; color: #ffcc00; text-transform: uppercase; }
        p { margin: 5px 0; font-size: 14px; }
        #speed-text { color: #00ffcc; font-weight: bold; }
        #damage-text { color: #ff4444; font-weight: bold; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>GTA: Душанбе 3D</h1>
        <p>Идоракунӣ: <b>W, A, S, D</b> ё тирчаҳо</p>
        <p>Суръат: <span id="speed-text">0</span> км/с</p>
        <p>Ҳолати мошин: <span id="damage-text">Ҳамааш солим аст (100%)</span></p>
    </div>

    <script>
        // Ибтидои саҳна ва камера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Рушноӣ ва сояҳо
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 300, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Замин ва шабакаи роҳҳои Душанбе
        const groundGeo = new THREE.PlaneGeometry(3000, 3000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

        for (let i = -1200; i <= 1200; i += 150) {
            let roadX = new THREE.Mesh(new THREE.PlaneGeometry(30, 3000), roadMat);
            roadX.rotation.x = -Math.PI / 2;
            roadX.position.set(i, 0.01, 0);
            scene.add(roadX);

            let lineX = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 3000), lineMat);
            lineX.rotation.x = -Math.PI / 2;
            lineX.position.set(i, 0.02, 0);
            scene.add(lineX);

            let roadZ = new THREE.Mesh(new THREE.PlaneGeometry(3000, 30), roadMat);
            roadZ.rotation.x = -Math.PI / 2;
            roadZ.position.set(0, 0.015, i);
            scene.add(roadZ);

            let lineZ = new THREE.Mesh(new THREE.PlaneGeometry(3000, 0.6), lineMat);
            lineZ.rotation.x = -Math.PI / 2;
            lineZ.position.set(0, 0.025, i);
            scene.add(lineZ);
        }

        // Сохтани биноҳои шаҳр дар кварталҳо
        const buildingColors = [0xd1d1d1, 0xb0c4de, 0xdcdcdc, 0xdeb887, 0xbc8f8f, 0xa9a9a9];
        for (let x = -1300; x <= 1300; x += 75) {
            for (let z = -1300; z <= 1300; z += 75) {
                if (Math.abs(x % 150) < 40 || Math.abs(z % 150) < 40) continue;

                let bHeight = 30 + Math.random() * 90;
                let bWidth = 45 + Math.random() * 15;
                let bDepth = 45 + Math.random() * 15;

                let bGeo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
                let bMat = new THREE.MeshStandardMaterial({ 
                    color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
                    roughness: 0.4
                });
                let building = new THREE.Mesh(bGeo, bMat);
                building.position.set(x + 37.5, bHeight / 2, z + 37.5);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            }
        }

        // Мошини бозигар (Муфассал)
        const carGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.8, roughness: 0.2 });
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.6, 4.2), bodyMat);
        lowerBody.position.y = 0.5;
        carGroup.add(lowerBody);

        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 2.2), cabinMat);
        cabin.position.set(0, 1.0, -0.2);
        carGroup.add(cabin);

        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        const headlight1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), lightMat);
        headlight1.position.set(0.65, 0.45, 2.11);
        carGroup.add(headlight1);

        const headlight2 = headlight1.clone();
        headlight2.position.set(-0.65, 0.45, 2.11);
        carGroup.add(headlight2);

        const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.35, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wheelPositions = [
            [-1.0, 0.38, 1.4], [1.0, 0.38, 1.4],
            [-1.0, 0.38, -1.4], [1.0, 0.38, -1.4]
        ];
        wheelPositions.forEach(pos => {
            let wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        carGroup.position.set(0, 0, 300);
        scene.add(carGroup);

        // Мошинҳои трафики шаҳр
        const trafficCars = [];
        const tColors = [0x0044cc, 0xffffff, 0x333333, 0xffcc00, 0x008000, 0xff8c00];
        for (let i = 0; i < 20; i++) {
            let tGroup = new THREE.Group();
            let tBody = new THREE.Mesh(
                new THREE.BoxGeometry(1.9, 0.6, 4.2), 
                new THREE.MeshStandardMaterial({ color: tColors[i % tColors.length], metalness: 0.5 })
            );
            tBody.position.y = 0.5;
            tGroup.add(tBody);

            let tX = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.floor(Math.random() * 6) * 150);
            let tZ = (Math.random() - 0.5) * 2500;
            tGroup.position.set(tX, 0, tZ);
            scene.add(tGroup);
            trafficCars.push({ group: tGroup, speed: 0.4 + Math.random() * 0.5 });
        }

        // Идоракунӣ тавассути тугмаҳо
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let carSpeed = 0;
        let carAngle = 0;
        const maxSpeed = 1.2;
        const acceleration = 0.02;
        let health = 100;

        function animate() {
            requestAnimationFrame(animate);

            if (keys['w'] || keys['arrowup']) {
                carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
            } else if (keys['s'] || keys['arrowdown']) {
                carSpeed = Math.max(carSpeed - acceleration, -maxSpeed / 2);
            } else {
                carSpeed *= 0.94;
            }

            if (Math.abs(carSpeed) > 0.02) {
                let turnFactor = carSpeed / maxSpeed;
                if (keys['a'] || keys['arrowleft']) carAngle += 0.035 * turnFactor;
                if (keys['d'] || keys['arrowright']) carAngle -= 0.035 * turnFactor;
            }

            carGroup.rotation.y = carAngle;
            carGroup.position.x -= Math.sin(carAngle) * carSpeed;
            carGroup.position.z -= Math.cos(carAngle) * carSpeed;

            // Маҳдудияти ҳудуди шаҳр
            if (carGroup.position.x > 1350) carGroup.position.x = 1350;
            if (carGroup.position.x < -1350) carGroup.position.x = -1350;
            if (carGroup.position.z > 1350) carGroup.position.z = 1350;
            if (carGroup.position.z < -1350) carGroup.position.z = -1350;

            // Трафик ва санҷиши садамаҳо
            trafficCars.forEach(item => {
                item.group.position.z += item.speed;
                if (item.group.position.z > 1400) item.group.position.z = -1400;

                let distance = carGroup.position.distanceTo(item.group.position);
                if (distance < 3.0 && Math.abs(carSpeed) > 0.2) {
                    health -= 3;
                    if (health < 0) health = 0;
                    document.getElementById('damage-text').innerText = `Садама рух дод! Саломатӣ: ${health}%`;
                    carSpeed = -carSpeed * 0.4;
                }
            });

            document.getElementById('speed-text').innerText = Math.round(Math.abs(carSpeed) * 80);

            // Камераи пушти мошин
            let camDist = 14;
            let camHeight = 5;
            let targetX = carGroup.position.x + Math.sin(carAngle) * camDist;
            let targetZ = carGroup.position.z + Math.cos(carAngle) * camDist;

            camera.position.lerp(new THREE.Vector3(targetX, carGroup.position.y + camHeight, targetZ), 0.15);
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
