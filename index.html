<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA-TJK - 3D Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        #game-container {
            width: 85vw;
            height: 70vh;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .loader-text {
            font-size: 1.2rem;
            color: #38bdf8;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .controls-hint {
            margin-top: 20px;
            background: rgba(30, 41, 59, 0.7);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #475569;
            font-size: 0.95rem;
            color: #cbd5e1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        span.key {
            background: #475569;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <header>
        <h1>GTA-TJK 3D Engine</h1>
        <p class="subtitle">Душанбе Open-World & Flight Simulator</p>
    </header>

    <div id="game-container">
        <div class="loader-text">Сатҳи бозӣ бор шуда истодааст...</div>
        <!-- Ин ҷо ҷойи канваси Three.js ё муҳити бозӣ мешавад -->
    </div>

    <div class="controls-hint">
        Идоракунӣ: Тугмаҳои <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> барои ҳаракат ва <span class="key">SPACE</span> барои амалиёт.
    </div>

    <script>
        // Ин ҷо метавонед логикаи асосии JavaScript ё Three.js-ро ворид кунед
        console.log("GTA-TJK Engine бомуваффақият оғоз шуд!");
    </script>
</body>
</html>
