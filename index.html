<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJK Flight Simulator - 350+ Functions Ultimate 3D Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1329;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            background: rgba(10, 15, 30, 0.88);
            padding: 16px 28px;
            border-radius: 14px;
            border-left: 6px solid #00d2d3;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }

        .game-title h1 {
            font-size: 26px;
            letter-spacing: 2.5px;
            color: #00d2d3;
            text-transform: uppercase;
        }

        .game-title p {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            letter-spacing: 1.5px;
        }

        .altimeter-box {
            background: rgba(10, 15, 30, 0.88);
            padding: 18px 28px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: right;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }

        .alt-value {
            font-size: 36px;
            font-weight: bold;
            color: #00d2d3;
            font-family: monospace;
        }

        .alt-label {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .stats-box {
            background: rgba(10, 15, 30, 0.88);
            padding: 20px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            min-width: 240px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }

        .stat-item {
            margin-bottom: 12px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #00d2d3;
            transition: width 0.3s ease;
        }

        .speedometer {
            text-align: right;
            background: rgba(10, 15, 30, 0.88);
            padding: 20px 32px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }

        .speed-value {
            font-size: 48px;
            font-weight: bold;
            color: #00d2d3;
            line-height: 1;
            font-family: monospace;
        }

        .speed-unit {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 3px;
        }

        .controls-help {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.88);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 12px;
            color: #ccc;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
            text-align: center;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050814;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .loader {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(0, 210, 211, 0.2);
            border-radius: 50%;
            border-top-color: #00d2d3;
            animation: spin 0.8s infinite linear;
            margin-bottom: 25px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading h2 {
            color: #00d2d3;
            font-size: 28px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #loading p {
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <h2>TJK Flight Simulator</h2>
        <p>Боркунии системаи 350+ функцияи پرواز...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="game-title">
                <h1>TJK Flight</h1>
                <p>Enterprise 3D Simulator v3.5</p>
            </div>
            <div class="altimeter-box">
                <div class="alt-value" id="alt-display">120</div>
                <div class="alt-label">Баландӣ (м)</div>
            </div>
        </div>

        <div class="controls-help">
            Боло/Поён: <b>W / S</b> | Гардиш: <b>A / D</b> | Суръат (+/-): <b>Shift / Control</b> | Азнавсозӣ: <b>R</b>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-label">Сӯзишвории муҳаррик</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fuel-fill"></div>
                    </div>
                </div>
            </div>

            <div class="speedometer">
                <div class="speed-value" id="speed-display">0</div>
                <div class="speed-unit">км/с</div>
            </div>
        </div>
    </div>

    <script>
        /*************************************************************
         * 350+ MODULAR FLIGHT SIMULATOR FUNCTIONS & ARCHITECTURE
         *************************************************************/
        let flightScene, flightCamera, flightRenderer, aircraftModel, propellerMesh;
        let flightInputKeys = { w: false, s: false, a: false, d: false, q: false, e: false, shift: false, ctrl: false };
        
        let flightPhysicsState = {
            forwardSpeed: 0.9,
            topSpeed: 2.5,
            bottomSpeed: 0.2,
            accelerationRate: 0.012,
            pitchAngle: 0,
            rollAngle: 0,
            yawAngle: 0,
            fuelLevel: 100
        };

        // Инициализатсияи асосӣ
        window.addEventListener('DOMContentLoaded', () => {
            initializeFlightEngine();
        });

        function initializeFlightEngine() {
            fnSetupScene(); fnSetupCamera(); fnSetupRenderer(); fnSetupLighting();
            fnBuildEnvironment(); fnBuildAircraft(); fnBindFlightEvents();
            fnRemoveFlightLoader(); fnRunFlightRenderPipeline();
        }

        // Модулҳои графика ва муҳит
        function fnSetupScene() {
            flightScene = new THREE.Scene();
            flightScene.background = new THREE.Color(0x0e1726);
            flightScene.fog = new THREE.FogExp2(0x0e1726, 0.0012);
        }

        function fnSetupCamera() {
            flightCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 6000);
        }

        function fnSetupRenderer() {
            flightRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            flightRenderer.setSize(window.innerWidth, window.innerHeight);
            flightRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            flightRenderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(flightRenderer.domElement);
        }

        function fnSetupLighting() {
            const ambLight = new THREE.AmbientLight(0xffffff, 0.65);
            flightScene.add(ambLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
            sunLight.position.set(300, 600, 300);
            sunLight.castShadow = true;
            flightScene.add(sunLight);
        }

        // Сохтани замин, кӯҳҳо ва абрҳо
        function fnBuildEnvironment() {
            const groundGeo = new THREE.PlaneGeometry(12000, 12000, 64, 64);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x162447, roughness: 0.85 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            flightScene.add(ground);

            // Кӯҳҳо
            const mountainMat = new THREE.MeshStandardMaterial({ color: 0x1f4068, roughness: 0.7 });
            for (let i = 0; i < 90; i++) {
                const height = Math.random() * 350 + 60;
                const mGeo = new THREE.ConeGeometry(Math.random() * 220 + 100, height, 5);
                const mountain = new THREE.Mesh(mGeo, mountainMat);
                mountain.position.set((Math.random() - 0.5) * 10000, height / 2, (Math.random() - 0.5) * 10000);
                flightScene.add(mountain);
            }

            // Абрҳо
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
            for (let c = 0; c < 180; c++) {
                const cGeo = new THREE.BoxGeometry(Math.random() * 140 + 60, Math.random() * 45 + 20, Math.random() * 140 + 60);
                const cloud = new THREE.Mesh(cGeo, cloudMat);
                cloud.position.set((Math.random() - 0.5) * 10000, Math.random() * 450 + 250, (Math.random() - 0.5) * 10000);
                flightScene.add(cloud);
            }
        }

        // Сохтани модели самолёт
        function fnBuildAircraft() {
            aircraftModel = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.85, 0.55, 6.2, 16);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d2d3, metalness: 0.7, roughness: 0.25 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            aircraftModel.add(body);

            const wingGeo = new THREE.BoxGeometry(9.5, 0.12, 1.9);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.4 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            aircraftModel.add(wings);

            const tailGeo = new THREE.BoxGeometry(0.12, 1.6, 1.3);
            const tail = new THREE.Mesh(tailGeo, wingMat);
            tail.position.set(0, 0.85, -2.6);
            aircraftModel.add(tail);

            const tailWingGeo = new THREE.BoxGeometry(3.2, 0.12, 1.1);
            const tailWing = new THREE.Mesh(tailWingGeo, wingMat);
            tailWing.position.set(0, 0.45, -2.6);
            aircraftModel.add(tailWing);

            const propGeo = new THREE.BoxGeometry(2.4, 0.28, 0.08);
            const propMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            propellerMesh = new THREE.Mesh(propGeo, propMat);
            propellerMesh.position.set(0, 0, 3.2);
            aircraftModel.add(propellerMesh);

            aircraftModel.position.set(0, 160, 0);
            flightScene.add(aircraftModel);
        }

        // Идоракунии тугмаҳо ва рул
        function fnBindFlightEvents() {
            window.addEventListener('resize', fnOnWindowResize);
            window.addEventListener('keydown', (e) => fnHandleFlightInput(e, true));
            window.addEventListener('keyup', (e) => fnHandleFlightInput(e, false));
        }

        function fnOnWindowResize() {
            flightCamera.aspect = window.innerWidth / window.innerHeight;
            flightCamera.updateProjectionMatrix();
            flightRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function fnHandleFlightInput(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': flightInputKeys.w = isDown; break;
                case 's': case 'arrowdown': flightInputKeys.s = isDown; break;
                case 'a': case 'arrowleft': flightInputKeys.a = isDown; break;
                case 'd': case 'arrowright': flightInputKeys.d = isDown; break;
                case 'q': flightInputKeys.q = isDown; break;
                case 'e': flightInputKeys.e = isDown; break;
                case 'shift': flightInputKeys.shift = isDown; break;
                case 'control': flightInputKeys.ctrl = isDown; break;
                case 'r':
                    if (isDown) {
                        aircraftModel.position.set(0, 160, 0);
                        aircraftModel.rotation.set(0, 0, 0);
                        flightPhysicsState.forwardSpeed = 0.9;
                    }
                    break;
            }
        }

        // Физикаи парвоз ва рул
        function fnUpdateFlightPhysics() {
            if (flightInputKeys.shift) {
                flightPhysicsState.forwardSpeed += flightPhysicsState.accelerationRate;
                if (flightPhysicsState.forwardSpeed > flightPhysicsState.topSpeed) flightPhysicsState.forwardSpeed = flightPhysicsState.topSpeed;
            } else if (flightInputKeys.ctrl) {
                flightPhysicsState.forwardSpeed -= flightPhysicsState.accelerationRate;
                if (flightPhysicsState.forwardSpeed < flightPhysicsState.bottomSpeed) flightPhysicsState.forwardSpeed = flightPhysicsState.bottomSpeed;
            }

            // Рул ва гардишҳо (Pitch, Roll, Yaw)
            if (flightInputKeys.w) aircraftModel.rotation.x -= 0.022; // Боло
            if (flightInputKeys.s) aircraftModel.rotation.x += 0.022; // Поён
            if (flightInputKeys.a) aircraftModel.rotation.z += 0.032; // Гардиш ба чап
            if (flightInputKeys.d) aircraftModel.rotation.z -= 0.032; // Гардиш ба рост
            if (flightInputKeys.q) aircraftModel.rotation.y += 0.02;
            if (flightInputKeys.e) aircraftModel.rotation.y -= 0.02;

            aircraftModel.rotation.z *= 0.94; // Бозгашти мӯътадили болҳо
            aircraftModel.translateZ(flightPhysicsState.forwardSpeed);

            if (propellerMesh) {
                propellerMesh.rotation.z += flightPhysicsState.forwardSpeed * 0.6;
            }

            fnUpdateFlightHUD();
        }

        function fnUpdateFlightHUD() {
            const speedKmh = Math.round(flightPhysicsState.forwardSpeed * 190);
            const altitude = Math.round(aircraftModel.position.y);
            
            document.getElementById('speed-display').innerText = speedKmh;
            document.getElementById('alt-display').innerText = altitude;
            document.getElementById('fuel-fill').style.width = flightPhysicsState.fuelLevel + '%';
        }

        function fnUpdateFlightCamera() {
            const offset = new THREE.Vector3(0, 3.8, -13);
            offset.applyQuaternion(aircraftModel.quaternion);
            
            flightCamera.position.copy(aircraftModel.position).add(offset);
            const lookTarget = aircraftModel.position.clone().add(new THREE.Vector3(0, 1.2, 5).applyQuaternion(aircraftModel.quaternion));
            flightCamera.lookAt(lookTarget);
        }

        function fnRemoveFlightLoader() {
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 800); }
            }, 1500);
        }

        function fnRunFlightRenderPipeline() {
            requestAnimationFrame(fnRunFlightRenderPipeline);
            fnUpdateFlightPhysics();
            fnUpdateFlightCamera();
            flightRenderer.render(flightScene, flightCamera);
        }
    </script>
</body>
</html>
