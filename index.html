<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Душанбе 3D - Мошини Муфассал</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #ffcc00;
            z-index: 10;
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #ffcc00; }
        p { margin: 3px 0; font-size: 14px; }
        #damage { color: #ff4444; font-weight: bold; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>GTA: Душанбе 3D</h1>
        <p>Идоракунӣ: <b>W, A, S, D</b> ё тирчаҳо</p>
        <p>Ҳолати мошин: <span id="damage">Ҳамааш солим аст</span></p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.006);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Рушноӣ
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // Замин ва Роҳҳо
        const groundGeo = new THREE.PlaneGeometry(600, 600);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x151515 });
        const mainRoad = new THREE.Mesh(new THREE.PlaneGeometry(20, 600), roadMat);
        mainRoad.rotation.x = -Math.PI / 2;
        mainRoad.position.y = 0.01;
        scene.add(mainRoad);

        const crossRoad = new THREE.Mesh(new THREE.PlaneGeometry(600, 20), roadMat);
        crossRoad.rotation.x = -Math.PI / 2;
        crossRoad.position.y = 0.02;
        scene.add(crossRoad);

        // Биноҳои шаҳр
        const buildingColors = [0xd1d1d1, 0xb0c4de, 0xdcdcdc, 0xbc8f8f, 0xdeb887];
        for (let x = -250; x <= 250; x += 30) {
            for (let z = -250; z <= 250; z += 30) {
                if (Math.abs(x) < 25 || Math.abs(z) < 25) continue;
                const bHeight = 25 + Math.random() * 35;
                const bGeo = new THREE.BoxGeometry(22, bHeight, 22);
                const bMat = new THREE.MeshStandardMaterial({ color: buildingColors[Math.floor(Math.random() * buildingColors.length)] });
                const building = new THREE.Mesh(bGeo, bMat);
                building.position.set(x, bHeight / 2, z);
                scene.add(building);
            }
        }

        // --- СОХТАНИ МОШИНИ МУФАССАЛ (ДИГАР ЧОРКУНЧА НЕСТ) ---
        const carGroup = new THREE.Group();

        // Қисми поёнии мошин (Бюгели асосӣ)
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.3, metalness: 0.8 });
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 4.0), bodyMat);
        lowerBody.position.y = 0.4;
        carGroup.add(lowerBody);

        // Қисми болоии мошин (Кабина / Боми шишагӣ)
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.1 });
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 2.0), cabinMat);
        cabin.position.set(0, 0.9, -0.2);
        carGroup.add(cabin);

        // Чароғҳои пеш (Фараҳо)
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        const headlight1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), lightMat);
        headlight1.position.set(0.6, 0.4, 2.01);
        carGroup.add(headlight1);

        const headlight2 = headlight1.clone();
        headlight2.position.set(-0.6, 0.4, 2.01);
        carGroup.add(headlight2);

        // Чархҳо (Шинаҳо)
        const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wheelPositions = [
            [-1.0, 0.35, 1.3], [1.0, 0.35, 1.3],
            [-1.0, 0.35, -1.3], [1.0, 0.35, -1.3]
        ];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        carGroup.position.set(0, 0, 50);
        scene.add(carGroup);

        // Мошинҳои трафик дар шаҳр
        const trafficCars = [];
        const tColors = [0x0044cc, 0xffffff, 0x333333, 0xffcc00, 0x008000];
        for (let i = 0; i < 8; i++) {
            let tBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 3.8), new THREE.MeshStandardMaterial({ color: tColors[i % tColors.length] }));
            tBody.position.set(5, 0.4, -i * 50);
            scene.add(tBody);
            trafficCars.push(tBody);
        }

        // Идоракунӣ
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let carSpeed = 0;
        const maxSpeed = 0.6;
        const acceleration = 0.015;
        let health = 100;

        function animate() {
            requestAnimationFrame(animate);

            if (keys['w'] || keys['arrowup']) {
                carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
            } else if (keys['s'] || keys['arrowdown']) {
                carSpeed = Math.max(carSpeed - acceleration, -maxSpeed / 2);
            } else {
                carSpeed *= 0.93;
            }

            carGroup.position.z -= carSpeed;

            if (keys['a'] || keys['arrowleft']) {
                carGroup.rotation.y += 0.04 * (carSpeed / maxSpeed || 0.1);
            }
            if (keys['d'] || keys['arrowright']) {
                carGroup.rotation.y -= 0.04 * (carSpeed / maxSpeed || 0.1);
            }

            trafficCars.forEach(tCar => {
                tCar.position.z += 0.25;
                if (tCar.position.z > 150) tCar.position.z = -200;

                let distance = carGroup.position.distanceTo(tCar.position);
                if (distance < 2.8 && Math.abs(carSpeed) > 0.1) {
                    health -= 2;
                    document.getElementById('damage').innerText = `Садама! Саломатӣ: ${health}%`;
                    carSpeed = -carSpeed * 0.4;
                }
            });

            const cameraOffset = new THREE.Vector3(0, 5, 14);
            cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
            camera.position.copy(carGroup.position).add(cameraOffset);
            camera.lookAt(carGroup.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
