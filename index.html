<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJK Flight Simulator - 3D Airplane Game</title>
    <style>
        /* ==========================================================
           1. CSS STYLES & FLIGHT HUD DESIGN SYSTEM
           ========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1329;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Flight HUD Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            background: rgba(10, 15, 30, 0.85);
            padding: 14px 24px;
            border-radius: 12px;
            border-left: 5px solid #00d2d3;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .game-title h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: #00d2d3;
            text-transform: uppercase;
        }

        .game-title p {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .altimeter-box {
            background: rgba(10, 15, 30, 0.85);
            padding: 16px 24px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: right;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .alt-value {
            font-size: 32px;
            font-weight: bold;
            color: #00d2d3;
            font-family: monospace;
        }

        .alt-label {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .stats-box {
            background: rgba(10, 15, 30, 0.85);
            padding: 18px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            min-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .stat-item {
            margin-bottom: 10px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #00d2d3;
            transition: width 0.3s ease;
        }

        .speedometer {
            text-align: right;
            background: rgba(10, 15, 30, 0.85);
            padding: 18px 28px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .speed-value {
            font-size: 44px;
            font-weight: bold;
            color: #00d2d3;
            line-height: 1;
            font-family: monospace;
        }

        .speed-unit {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .controls-help {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.85);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050814;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 210, 211, 0.2);
            border-radius: 50%;
            border-top-color: #00d2d3;
            animation: spin 0.9s infinite linear;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading h2 {
            color: #00d2d3;
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        #loading p {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <h2>TJK Flight Simulator</h2>
        <p>Боркунии муҳити осмон ва физикаи самолёт...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="game-title">
                <h1>TJK Flight</h1>
                <p>3D Simulator v1.0</p>
            </div>
            <div class="altimeter-box">
                <div class="alt-value" id="alt-display">100</div>
                <div class="alt-label">Баландӣ (м)</div>
            </div>
        </div>

        <div class="controls-help">
            Боварӣ/Пастӣ: <b>W / S</b> | Гардиш: <b>A / D</b> | Суръат: <b>Shift / Control</b> | Азнавсозӣ: <b>R</b>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-label">Сӯзишвории муҳаррик</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fuel-fill"></div>
                    </div>
                </div>
            </div>

            <div class="speedometer">
                <div class="speed-value" id="speed-display">0</div>
                <div class="speed-unit">нот / км/с</div>
            </div>
        </div>
    </div>

    <script>
        /*************************************************************
         * 2. JAVASCRIPT FLIGHT SIMULATOR ENGINE & PHYSICS
         *************************************************************/
        let scene, camera, renderer, airplane;
        let keys = { w: false, s: false, a: false, d: false, q: false, e: false, shift: false, ctrl: false };
        
        let planeState = {
            speed: 0.8,
            maxSpeed: 2.2,
            minSpeed: 0.3,
            acceleration: 0.01,
            pitch: 0, // боло ва поён
            roll: 0,  // гардиш ба паҳлӯ
            yaw: 0,   // самт
            fuel: 100
        };

        let terrainChunks = [];

        window.addEventListener('DOMContentLoaded', () => {
            initFlightSimulator();
        });

        function initFlightSimulator() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x101b35);
            scene.fog = new THREE.FogExp2(0x101b35, 0.001);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(200, 500, 200);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // 5. Build World (Ocean, Islands/Mountains & Clouds)
            buildSkyAndTerrain();

            // 6. Build Airplane Model
            buildAirplaneModel();

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handlePlaneInput(e, true));
            window.addEventListener('keyup', (e) => handlePlaneInput(e, false));

            // Remove loading screen
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 1000);

            // Start Main Loop
            runFlightLoop();
        }

        function buildSkyAndTerrain() {
            // Замин ё уқёнус (Ground/Water plane)
            const groundGeo = new THREE.PlaneGeometry(10000, 10000, 64, 64);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x1e3d59,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Кӯҳҳо ва ҷазираҳо (Mountains generator)
            const mountainMat = new THREE.MeshStandardMaterial({ color: 0x2b4c7e, roughness: 0.7 });
            for (let i = 0; i < 80; i++) {
                const height = Math.random() * 300 + 50;
                const mGeo = new THREE.ConeGeometry(Math.random() * 200 + 100, height, 6);
                const mountain = new THREE.Mesh(mGeo, mountainMat);
                mountain.position.set(
                    (Math.random() - 0.5) * 8000,
                    height / 2,
                    (Math.random() - 0.5) * 8000
                );
                scene.add(mountain);
            }

            // Абрҳо дар осмон (Clouds)
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            for (let c = 0; c < 150; c++) {
                const cGeo = new THREE.BoxGeometry(Math.random() * 120 + 50, Math.random() * 40 + 20, Math.random() * 120 + 50);
                const cloud = new THREE.Mesh(cGeo, cloudMat);
                cloud.position.set(
                    (Math.random() - 0.5) * 9000,
                    Math.random() * 400 + 200,
                    (Math.random() - 0.5) * 9000
                );
                scene.add(cloud);
            }
        }

        function buildAirplaneModel() {
            airplane = new THREE.Group();

            // Корпуси самолёт (Fuselage)
            const bodyGeo = new THREE.CylinderGeometry(0.8, 0.5, 6, 16);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d2d3, metalness: 0.6, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            airplane.add(body);

            // Болҳои асосӣ (Wings)
            const wingGeo = new THREE.BoxGeometry(9, 0.1, 1.8);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.4 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.set(0, 0, 0);
            airplane.add(wings);

            // Думи самолёт (Tail)
            const tailGeo = new THREE.BoxGeometry(0.1, 1.5, 1.2);
            const tail = new THREE.Mesh(tailGeo, wingMat);
            tail.position.set(0, 0.8, -2.5);
            airplane.add(tail);

            const tailWingGeo = new THREE.BoxGeometry(3, 0.1, 1);
            const tailWing = new THREE.Mesh(tailWingGeo, wingMat);
            tailWing.position.set(0, 0.4, -2.5);
            airplane.add(tailWing);

            // Пропеллер (Propeller)
            const propGeo = new THREE.BoxGeometry(2.2, 0.25, 0.08);
            const propMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            window.propellerMesh = new THREE.Mesh(propGeo, propMat);
            window.propellerMesh.position.set(0, 0, 3.1);
            airplane.add(window.propellerMesh);

            airplane.position.set(0, 150, 0);
            scene.add(airplane);
        }

        function handlePlaneInput(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': keys.w = isDown; break;
                case 's': keys.s = isDown; break;
                case 'a': keys.a = isDown; break;
                case 'd': keys.d = isDown; break;
                case 'q': keys.q = isDown; break;
                case 'e': keys.e = isDown; break;
                case 'shift': keys.shift = isDown; break;
                case 'control': keys.ctrl = isDown; break;
                case 'r':
                    if (isDown) {
                        airplane.position.set(0, 150, 0);
                        airplane.rotation.set(0, 0, 0);
                        planeState.speed = 0.8;
                    }
                    break;
            }
        }

        function updatePlanePhysics() {
            // Суръатгирӣ ва пастшавии суръат
            if (keys.shift) {
                planeState.speed += planeState.acceleration;
                if (planeState.speed > planeState.maxSpeed) planeState.speed = planeState.maxSpeed;
            } else if (keys.ctrl) {
                planeState.speed -= planeState.acceleration;
                if (planeState.speed < planeState.minSpeed) planeState.speed = planeState.minSpeed;
            }

            // Идоракунии болҳо ва гардишҳо (Pitch, Roll, Yaw)
            if (keys.w) airplane.rotation.x -= 0.02; // Боло
            if (keys.s) airplane.rotation.x += 0.02; // Поён
            if (keys.a) airplane.rotation.z += 0.03; // Гардиш ба чап
            if (keys.d) airplane.rotation.z -= 0.03; // Гардиш ба рост
            if (keys.q) airplane.rotation.y += 0.02;
            if (keys.e) airplane.rotation.y -= 0.02;

            // Гардиши муътадили болҳо ҳангоми паст шудани тугмаҳо
            airplane.rotation.z *= 0.95;

            // Ҳаракат ба пеш мувофиқи самти самолёт
            airplane.translateZ(planeState.speed);

            // Гардиши пропеллер
            if (window.propellerMesh) {
                window.propellerMesh.rotation.z += planeState.speed * 0.5;
            }

            // Азнавсозии UI HUD
            const speedKmh = Math.round(planeState.speed * 180);
            const altitude = Math.round(airplane.position.y);
            
            document.getElementById('speed-display').innerText = speedKmh;
            document.getElementById('alt-display').innerText = altitude;
            document.getElementById('fuel-fill').style.width = planeState.fuel + '%';
        }

        function updateFlightCamera() {
            // Камераи паси самолёт (Third-person Chase Camera)
            const offset = new THREE.Vector3(0, 3.5, -12);
            offset.applyQuaternion(airplane.quaternion);
            
            camera.position.copy(airplane.position).add(offset);
            
            const lookTarget = airplane.position.clone().add(new THREE.Vector3(0, 1, 5).applyQuaternion(airplane.quaternion));
            camera.lookAt(lookTarget);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function runFlightLoop() {
            requestAnimationFrame(runFlightLoop);

            updatePlanePhysics();
            updateFlightCamera();

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
