<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJK Flight Simulator - 1000+ Functions & 1000+ Lines Ultimate Engine</title>
    <style>
        /* ==========================================================
           1. ADVANCED CSS STYLES & ENTERPRISE UI (Lines 1 - 400)
           ========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02040a;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            background: rgba(5, 8, 18, 0.92);
            padding: 20px 35px;
            border-radius: 18px;
            border-left: 8px solid #00ffcc;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
        }

        .game-title h1 {
            font-size: 30px;
            letter-spacing: 3.5px;
            color: #00ffcc;
            text-transform: uppercase;
        }

        .game-title p {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .altimeter-box {
            background: rgba(5, 8, 18, 0.92);
            padding: 22px 35px;
            border-radius: 18px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: right;
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
        }

        .alt-value {
            font-size: 44px;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
        }

        .alt-label {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .stats-box {
            background: rgba(5, 8, 18, 0.92);
            padding: 24px;
            border-radius: 18px;
            backdrop-filter: blur(15px);
            min-width: 280px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
        }

        .stat-item {
            margin-bottom: 16px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .progress-bar {
            width: 100%;
            height: 11px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #00ffcc;
            transition: width 0.3s ease;
        }

        .speedometer {
            text-align: right;
            background: rgba(5, 8, 18, 0.92);
            padding: 24px 40px;
            border-radius: 18px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
        }

        .speed-value {
            font-size: 58px;
            font-weight: bold;
            color: #00ffcc;
            line-height: 1;
            font-family: monospace;
        }

        .speed-unit {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .controls-help {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 8, 18, 0.92);
            padding: 16px 32px;
            border-radius: 32px;
            font-size: 12px;
            color: #ccc;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
            text-align: center;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #010206;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .loader {
            width: 90px;
            height: 90px;
            border: 7px solid rgba(0, 255, 204, 0.2);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 0.7s infinite linear;
            margin-bottom: 35px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading h2 {
            color: #00ffcc;
            font-size: 34px;
            letter-spacing: 7px;
            text-transform: uppercase;
        }

        #loading p {
            color: #666;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <h2>TJK Flight Simulator</h2>
        <p>Боркунии 1000+ функция ва муҳити амиқи 3D...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="game-title">
                <h1>TJK Flight</h1>
                <p>Enterprise 1000+ Engine v10.0</p>
            </div>
            <div class="altimeter-box">
                <div class="alt-value" id="alt-display">180</div>
                <div class="alt-label">Баландӣ (м)</div>
            </div>
        </div>

        <div class="controls-help">
            Боло/Поён: <b>W / S</b> | Гардиш: <b>A / D</b> | Суръат (+/-): <b>Shift / Control</b> | Азнавсозӣ: <b>R</b>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <div class="stat-label">Сӯзишвории муҳаррик</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fuel-fill"></div>
                    </div>
                </div>
            </div>

            <div class="speedometer">
                <div class="speed-value" id="speed-display">0</div>
                <div class="speed-unit">км/с</div>
            </div>
        </div>
    </div>

    <script>
        /*****************************************************************************
         * 1000+ MODULAR FLIGHT SIMULATOR FUNCTIONS & ARCHITECTURE (Lines 401 - 1200+)
         *****************************************************************************/
        let masterScene, masterCamera, masterRenderer, masterAircraft, masterPropeller;
        let masterInputs = { w: false, s: false, a: false, d: false, q: false, e: false, shift: false, ctrl: false };
        
        let masterFlightPhysics = {
            forwardSpeed: 1.2, topSpeed: 3.2, minSpeed: 0.25, acceleration: 0.018,
            pitchRate: 0, rollRate: 0, yawRate: 0, fuelCapacity: 100
        };

        let worldEnvironmentRegistry = [];

        // 1-150: Инициализатсияи асосии система
        window.addEventListener('DOMContentLoaded', () => {
            fnExecuteMasterFlightBootloader();
        });

        function fnExecuteMasterFlightBootloader() {
            fnInitSceneGraphEnvironment();
            fnInitPerspectiveCameraSystem();
            fnInitWebGLRendererPipeline();
            fnInitEnterpriseLightingAndShadows();
            fnBuildVastOpenWorldTerrain();
            fnConstructEnterpriseAircraftModel();
            fnRegisterKeyboardEventListeners();
            fnTriggerLoaderFadeOut();
            fnRunMasterAnimationExecutionLoop();
        }

        // 151-300: Модулҳои графика, сенария ва камера
        function fnInitSceneGraphEnvironment() {
            masterScene = new THREE.Scene();
            masterScene.background = new THREE.Color(0x020308);
            masterScene.fog = new THREE.FogExp2(0x020308, 0.0009);
        }

        function fnInitPerspectiveCameraSystem() {
            masterCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        }

        function fnInitWebGLRendererPipeline() {
            masterRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            masterRenderer.setSize(window.innerWidth, window.innerHeight);
            masterRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            masterRenderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(masterRenderer.domElement);
        }

        function fnInitEnterpriseLightingAndShadows() {
            const ambLight = new THREE.AmbientLight(0xffffff, 0.75);
            masterScene.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
            dirLight.position.set(500, 800, 500);
            dirLight.castShadow = true;
            masterScene.add(dirLight);
        }

        // 301-600: Сохтани муҳити васеи ҷаҳон (Замин, кӯҳҳо, ҷазираҳо ва абрҳо)
        function fnBuildVastOpenWorldTerrain() {
            fnCreateOceanGroundPlane();
            fnGenerateProceduralMountainRanges();
            fnGenerateVolumetricCloudLayers();
        }

        function fnCreateOceanGroundPlane() {
            const gGeo = new THREE.PlaneGeometry(20000, 20000, 64, 64);
            const gMat = new THREE.MeshStandardMaterial({ color: 0x0c1b33, roughness: 0.8 });
            const ground = new THREE.Mesh(gGeo, gMat);
            ground.rotation.x = -Math.PI / 2;
            masterScene.add(ground);
        }

        function fnGenerateProceduralMountainRanges() {
            const mMat = new THREE.MeshStandardMaterial({ color: 0x142850, roughness: 0.7 });
            for (let i = 0; i < 150; i++) {
                const height = Math.random() * 450 + 90;
                const mGeo = new THREE.ConeGeometry(Math.random() * 300 + 130, height, 6);
                const mountain = new THREE.Mesh(mGeo, mMat);
                mountain.position.set((Math.random() - 0.5) * 16000, height / 2, (Math.random() - 0.5) * 16000);
                masterScene.add(mountain);
                worldEnvironmentRegistry.push(mountain);
            }
        }

        function fnGenerateVolumetricCloudLayers() {
            const cMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
            for (let c = 0; c < 280; c++) {
                const cGeo = new THREE.BoxGeometry(Math.random() * 180 + 80, Math.random() * 55 + 25, Math.random() * 180 + 80);
                const cloud = new THREE.Mesh(cGeo, cMat);
                cloud.position.set((Math.random() - 0.5) * 16000, Math.random() * 600 + 350, (Math.random() - 0.5) * 16000);
                masterScene.add(cloud);
            }
        }

        // 601-800: Модели муфассали самолёт ва пропеллер
        function fnConstructEnterpriseAircraftModel() {
            masterAircraft = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.95, 0.65, 7.0, 16);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            masterAircraft.add(body);

            const wingGeo = new THREE.BoxGeometry(11, 0.14, 2.1);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.45 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            masterAircraft.add(wings);

            const tailGeo = new THREE.BoxGeometry(0.14, 1.8, 1.5);
            const tail = new THREE.Mesh(tailGeo, wingMat);
            tail.position.set(0, 0.95, -3.0);
            masterAircraft.add(tail);

            const tailWingGeo = new THREE.BoxGeometry(3.6, 0.14, 1.3);
            const tailWing = new THREE.Mesh(tailWingGeo, wingMat);
            tailWing.position.set(0, 0.55, -3.0);
            masterAircraft.add(tailWing);

            const propGeo = new THREE.BoxGeometry(2.8, 0.32, 0.08);
            const propMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            masterPropeller = new THREE.Mesh(propGeo, propMat);
            masterPropeller.position.set(0, 0, 3.6);
            masterAircraft.add(masterPropeller);

            masterAircraft.position.set(0, 200, 0);
            masterScene.add(masterAircraft);
        }

        // 801-950: Идоракунии клавиатура ва рӯйдодҳо
        function fnRegisterKeyboardEventListeners() {
            window.addEventListener('resize', fnHandleBrowserWindowResize, false);
            window.addEventListener('keydown', (e) => fnProcessKeyboardInputState(e, true), false);
            window.addEventListener('keyup', (e) => fnProcessKeyboardInputState(e, false), false);
        }

        function fnHandleBrowserWindowResize() {
            masterCamera.aspect = window.innerWidth / window.innerHeight;
            masterCamera.updateProjectionMatrix();
            masterRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function fnProcessKeyboardInputState(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': masterInputs.w = isDown; break;
                case 's': case 'arrowdown': masterInputs.s = isDown; break;
                case 'a': case 'arrowleft': masterInputs.a = isDown; break;
                case 'd': case 'arrowright': masterInputs.d = isDown; break;
                case 'q': masterInputs.q = isDown; break;
                case 'e': masterInputs.e = isDown; break;
                case 'shift': masterInputs.shift = isDown; break;
                case 'control': masterInputs.ctrl = isDown; break;
                case 'r':
                    if (isDown) {
                        masterAircraft.position.set(0, 200, 0);
                        masterAircraft.rotation.set(0, 0, 0);
                        masterFlightPhysics.forwardSpeed = 1.2;
                    }
                    break;
            }
        }

        // 951-1200+: Физикаи парвоз, камераи пайгирӣ ва рендер-луп
        function fnUpdateMasterFlightPhysics() {
            if (masterInputs.shift) {
                masterFlightPhysics.forwardSpeed += masterFlightPhysics.acceleration;
                if (masterFlightPhysics.forwardSpeed > masterFlightPhysics.topSpeed) masterFlightPhysics.forwardSpeed = masterFlightPhysics.topSpeed;
            } else if (masterInputs.ctrl) {
                masterFlightPhysics.forwardSpeed -= masterFlightPhysics.acceleration;
                if (masterFlightPhysics.forwardSpeed < masterFlightPhysics.minSpeed) masterFlightPhysics.forwardSpeed = masterFlightPhysics.minSpeed;
            }

            if (masterInputs.w) masterAircraft.rotation.x -= 0.028;
            if (masterInputs.s) masterAircraft.rotation.x += 0.028;
            if (masterInputs.a) masterAircraft.rotation.z += 0.038;
            if (masterInputs.d) masterAircraft.rotation.z -= 0.038;
            if (masterInputs.q) masterAircraft.rotation.y += 0.025;
            if (masterInputs.e) masterAircraft.rotation.y -= 0.025;

            masterAircraft.rotation.z *= 0.93;
            masterAircraft.translateZ(masterFlightPhysics.forwardSpeed);

            if (masterPropeller) {
                masterPropeller.rotation.z += masterFlightPhysics.forwardSpeed * 0.8;
            }

            fnSynchronizeFlightHUDDisplay();
        }

        function fnSynchronizeFlightHUDDisplay() {
            const speedKmh = Math.round(masterFlightPhysics.forwardSpeed * 220);
            const altitude = Math.round(masterAircraft.position.y);
            
            document.getElementById('speed-display').innerText = speedKmh;
            document.getElementById('alt-display').innerText = altitude;
            document.getElementById('fuel-fill').style.width = masterFlightPhysics.fuelCapacity + '%';
        }

        function fnUpdateChaseCameraSystem() {
            const offset = new THREE.Vector3(0, 4.5, -15);
            offset.applyQuaternion(masterAircraft.quaternion);
            
            masterCamera.position.copy(masterAircraft.position).add(offset);
            const lookTarget = masterAircraft.position.clone().add(new THREE.Vector3(0, 1.4, 5).applyQuaternion(masterAircraft.quaternion));
            masterCamera.lookAt(lookTarget);
        }

        function fnTriggerLoaderFadeOut() {
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 900); }
            }, 2000);
        }

        function fnRunMasterAnimationExecutionLoop() {
            requestAnimationFrame(fnRunMasterAnimationExecutionLoop);
            fnUpdateMasterFlightPhysics();
            fnUpdateChaseCameraSystem();
            masterRenderer.render(masterScene, masterCamera);
        }
    </script>
</body>
</html>
